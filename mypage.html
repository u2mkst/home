<!DOCTYPE html>
<html lang="ko">

    <style>

            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');

        }

            font-weight: normal;
            font-style: normal;
        }
        
        body {

            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);

            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            color: #333; 
            overflow-x: hidden; 
            padding: 40px 0;
            box-sizing: border-box;
        }
        
        .container { 
            width: 100%; 
            max-width: 430px; 
            padding: 24px; 
            box-sizing: border-box; 
        }

        .header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .close-btn {
            font-size: 1.6rem;
            color: #718096;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            font-weight: bold;
            background: none;
            border: none;
            padding: 5px;
            line-height: 1;
        }
        .close-btn:hover {
            color: #6c5ce7;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.4);
            padding: 24px 20px;
            border-radius: 24px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(149, 157, 165, 0.08);
            margin-bottom: 20px;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 18px;
            width: 100%;

            position: relative;
        }
        .input-wrapper:last-child {

        }
        .input-wrapper label {
            display: block;
            font-size: 0.85rem;

            position: relative;
            width: 100%;
        }
        .input-pw input {
            padding-right: 45px !important;
        }
        .input-pw .eyes {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            transition: color 0.2s;
            user-select: none;
        }
        .input-pw .eyes:hover {

        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;

            box-shadow: 0 2px 8px rgba(0,0,0,0.01);

            color: #2c3e50;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
        }

        .section-divider {
            border-top: 1px dashed rgba(108, 92, 231, 0.3);
            margin: 24px 0 20px 0;
            position: relative;
        }
        .section-title {
            font-size: 0.8rem; color: #6c5ce7; font-weight: bold;
            background: #f0eefc; padding: 4px 10px; border-radius: 20px;
            position: absolute; top: -12px; left: 10px;
        }

        .autocomplete-list {
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px; 
            max-height: 180px; 
            overflow-y: auto;
            border: 1px solid rgba(108, 92, 231, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            z-index: 1000; 
            margin-top: 6px;
            padding: 0;
            list-style: none;
            backdrop-filter: blur(10px);
        }
        .autocomplete-item {
            padding: 12px 16px; 
            cursor: pointer; 
            font-size: 0.9rem;
            color: #333; 
            border-bottom: 1px solid rgba(0,0,0,0.03);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { 
            background: rgba(108, 92, 231, 0.08);

            border-radius: 50%;

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: -0.2px;
            word-break: keep-all;
            line-height: 1.45;
        }

        .btn-flex-group { display: flex; gap: 8px; margin-top: 15px; }
        .modal-btn { background-color: #6c5ce7; color: #ffffff; border: none; padding: 14px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .modal-btn:hover { background-color: #5b4bc4; }
        .btn-cancel { background-color: #e2e8f0; color: #4a5568; width: 100%; border: none; padding: 14px 0; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .btn-cancel:hover { background-color: #cbd5e1; }
        .hidden { display: none !important; }

        /* 공통 바텀시트 UI */
        .bottom-sheet-overlay {

            top: 0; left: 0; width: 100%; height: 100%;

            backdrop-filter: blur(4px);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .bottom-sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;

        }
        .sheet-handle {
            width: 40px;

        .sheet-desc {
            font-size: 0.88rem;

        .sheet-desc span {
            color: #6c5ce7;
            font-weight: bold;

        /* 🤖 reCAPTCHA 중앙 정렬 박스 */
        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 로딩 화면 -->

        <div class="delete-account-zone">
            <button onclick="openDeleteBottomSheet()" class="delete-btn">학원 앱 서비스 회원 탈퇴</button>

    <!-- 🤖 유투엠 아이디 변경 reCAPTCHA 바텀시트 -->

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
            authDomain: "ksthome-76889.firebaseapp.com",
            databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
            projectId: "ksthome-76889",
            storageBucket: "ksthome-76889.firebasestorage.app",
            messagingSenderId: "411945142173",
            appId: "1:411945142173:web:c6fdb499040b2a5a4f9174",
            measurementId: "G-72TJ0364MJ"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        const SECRET_SALT = "u2mkst!"; 
        const NEIS_API_KEY = "19f78fd07bfb4243a6333e7bf4641bfc"; 

        // 🤖 Google reCAPTCHA v2 사이트 키 적용
        const RECAPTCHA_SITE_KEY = "6LcoRYAtAAAAAP_83dJyhmTfWrTrer3QUYf8Pof1";
        let recaptchaWidgetId = null;

        // Google reCAPTCHA SDK 로드 후 동적 렌더링
        window.onloadCallback = function() {
            if (document.getElementById('recaptchaWidget')) {
                recaptchaWidgetId = grecaptcha.render('recaptchaWidget', {
                    'sitekey': RECAPTCHA_SITE_KEY
                });
            }
        };

        let autoSaveTimer = null;
        let isInitialLoad = true;
        let originalU2mId = ""; 
        let pendingU2mId = "";  

        function togglePasswordVisibility(inputId, eyeBtn) {
            const input = document.getElementById(inputId);
            const icon = eyeBtn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function decryptAES(cipherText) {
            if (!cipherText) return "";
            try {
                const cleanCipherText = String(cipherText).trim();
                if (!cleanCipherText.startsWith("U2FsdGVkX1")) return cleanCipherText;
                const bytes = CryptoJS.AES.decrypt(cleanCipherText, SECRET_SALT);
                return bytes.toString(CryptoJS.enc.Utf8) || cleanCipherText; 
            } catch (e) {
                console.error("🚨 복호화 에러:", e);
                return String(cipherText); 
            }
        }

        function encryptAES(plainText) {
            if (plainText === null || plainText === undefined) return "";
            const textString = String(plainText).trim();
            return CryptoJS.AES.encrypt(textString, SECRET_SALT).toString();
        }

        const schoolInput = document.getElementById('schoolName');
        const schoolList = document.getElementById('schoolList');
        const schoolCodeInput = document.getElementById('schoolCode');

        schoolInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
                schoolCodeInput.value = '';
                return;
            }

            const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_API_KEY}&Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    schoolList.innerHTML = '';
                    if (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) {
                        const rows = data.schoolInfo[1].row;
                        schoolList.classList.remove('hidden');
                        rows.forEach(item => {
                            const li = document.createElement('li');
                            li.className = 'autocomplete-item';
                            li.innerHTML = `${item.SCHUL_NM} <span class="school-region">${item.ATPT_OFCDC_SC_NM}</span>`;
                            li.addEventListener('click', () => {
                                schoolInput.value = item.SCHUL_NM;
                                schoolCodeInput.value = item.SD_SCHUL_CODE;
                                schoolList.innerHTML = '';
                                schoolList.classList.add('hidden');
                                triggerAutoSave();
                            });
                            schoolList.appendChild(li);
                        });
                    } else {
                        schoolList.classList.add('hidden');
                    }
                })
                .catch(err => { console.error(err); });
        });

        document.addEventListener('click', function(e) {
            if (e.target !== schoolInput && e.target !== schoolList) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
            }
        });

        window.onload = function() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    database.ref(`students/${user.uid}`).once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            document.getElementById('studentName').value = decryptAES(data.name);
                            document.getElementById('schoolName').value = data.schoolName || '';
                            document.getElementById('schoolCode').value = data.schoolCode || '';
                            
                            if (data.teacher) {
                                document.getElementById('teacherName').value = data.teacher;
                            }
                            
                            originalU2mId = data.u2mId || '';
                            document.getElementById('u2mId').value = originalU2mId;
                            document.getElementById('u2mPhone').value = decryptAES(data.phone);
                            
                            const rawMathflatId = data.studentPhone ? decryptAES(data.studentPhone) : (data.mathflatId || '');
                            document.getElementById('mathflatId').value = rawMathflatId;
                            
                            document.getElementById('mathflatPw').value = decryptAES(data.mathflatPw);
                            
                            document.getElementById('dataLoadingOverlay').style.display = 'none';
                            
                            bindAutoSaveEvents();
                            setTimeout(() => {
                                isInitialLoad = false;
                            }, 300);
                        } else {
                            document.getElementById('dataLoadingOverlay').style.display = 'none';
                            showToast("학생 데이터를 찾을 수 없습니다.");
                            setTimeout(() => { window.location.replace('login.html'); }, 1500);
                        }
                    });
                } else {
                    window.location.replace('login.html');
                }
            });
        };

        function bindAutoSaveEvents() {
            const inputs = ['studentName', 'schoolName', 'teacherName', 'u2mPhone', 'mathflatId', 'mathflatPw'];
            inputs.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('input', triggerAutoSave);
                    element.addEventListener('change', triggerAutoSave);
                    element.addEventListener('blur', triggerAutoSave);
                }
            });

            const u2mInput = document.getElementById('u2mId');
            if (u2mInput) {
                u2mInput.addEventListener('change', handleU2mIdChange);
                u2mInput.addEventListener('blur', handleU2mIdChange);
            }
        }

        // 아이디 입력 변경 감지
        function handleU2mIdChange() {
            if (isInitialLoad) return;
            const currentVal = document.getElementById('u2mId').value.trim();
            if (currentVal !== originalU2mId && currentVal.length > 0) {
                pendingU2mId = currentVal;
                
                // 💡 학생 화면에는 도메인 주소(@knp.com 등)를 안 붙이고 입력한 순수 아이디만 표시
                document.getElementById('newU2mIdText').innerText = `'${pendingU2mId}'`;
                
                // reCAPTCHA 초기화
                if (typeof grecaptcha !== 'undefined' && recaptchaWidgetId !== null) {
                    grecaptcha.reset(recaptchaWidgetId);
                }
                openBottomSheet('u2mBottomSheetOverlay', 'u2mBottomSheet');
            }
        }

        function openBottomSheet(overlayId, sheetId) {
            document.getElementById(overlayId).classList.add('active');
            document.getElementById(sheetId).classList.add('active');
        }

        function closeBottomSheet(overlayId, sheetId) {
            document.getElementById(overlayId).classList.remove('active');
            document.getElementById(sheetId).classList.remove('active');
        }

        // 🤖 reCAPTCHA 캡차 확인 완료 후 아이디 변경
        function confirmU2mIdChange() {
            if (typeof grecaptcha === 'undefined') {
                showToast("reCAPTCHA 로드에 실패했습니다. 페이지를 새로고침해 주세요.");
                return;
            }

            const response = grecaptcha.getResponse(recaptchaWidgetId);
            if (!response || response.length === 0) {
                showToast("🤖 '로봇이 아닙니다' 체크박스를 먼저 진행해 주세요.");
                return;
            }

            closeBottomSheet('u2mBottomSheetOverlay', 'u2mBottomSheet');
            const user = auth.currentUser;
            if (!user) return;

            database.ref(`students/${user.uid}`).update({ u2mId: pendingU2mId })
                .then(() => {
                    originalU2mId = pendingU2mId;
                    showToast("💾 유투엠 아이디가 성공적으로 변경되었습니다.");
                })
                .catch((err) => {
                    console.error(err);
                    showToast("❌ 유투엠 아이디 변경 실패");
                    document.getElementById('u2mId').value = originalU2mId;
                });
        }

        function cancelU2mIdChange() {
            closeBottomSheet('u2mBottomSheetOverlay', 'u2mBottomSheet');
            document.getElementById('u2mId').value = originalU2mId;
            if (typeof grecaptcha !== 'undefined' && recaptchaWidgetId !== null) {
                grecaptcha.reset(recaptchaWidgetId);
            }
        }

        function triggerAutoSave() {
            if (isInitialLoad) return;
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                updateStudentProfileAuto();
            }, 700);
        }

        function updateStudentProfileAuto() {
            const user = auth.currentUser;
            if (!user) return;

            const studentName = document.getElementById('studentName').value.trim();
            const schoolName = document.getElementById('schoolName').value.trim();
            const schoolCode = document.getElementById('schoolCode').value.trim();
            const selectedTeacher = document.getElementById('teacherName').value;
            const phoneTail = document.getElementById('u2mPhone').value.trim();
            const mathflatPhone = document.getElementById('mathflatId').value.trim().replace(/[^0-9]/g, '');
            const mathflatPw = document.getElementById('mathflatPw').value.trim();

            const updatedObject = {};

            if (studentName) updatedObject.name = encryptAES(studentName);
            if (schoolName) updatedObject.schoolName = schoolName;
            if (schoolCode) updatedObject.schoolCode = schoolCode;
            if (selectedTeacher) updatedObject.teacher = selectedTeacher;
            if (phoneTail) updatedObject.phone = encryptAES(phoneTail);
            if (mathflatPhone) {
                updatedObject.studentPhone = encryptAES(mathflatPhone);
                updatedObject.mathflatId = mathflatPhone;
            }
            if (mathflatPw) updatedObject.mathflatPw = encryptAES(mathflatPw);

            if (Object.keys(updatedObject).length === 0) return;

            database.ref(`students/${user.uid}`).update(updatedObject)
                .then(() => {
                    if (phoneTail) {
                        const studentPassword = "00" + phoneTail; 
                        localStorage.setItem('u2m_pw', studentPassword);
                    }
                    showToast("💾 변경사항이 자동으로 저장되었습니다.");
                })
                .catch((err) => {
                    console.error("자동 저장 실패:", err);
                    showToast("❌ 저장 실패: 네트워크 상태를 확인하세요.");
                });
        }

        function openDeleteBottomSheet() {
            document.getElementById('reauthId').value = originalU2mId;
            const phoneTail = document.getElementById('u2mPhone').value.trim();
            document.getElementById('reauthPw').value = (phoneTail && phoneTail.length === 4) ? phoneTail : '';
            openBottomSheet('reauthBottomSheetOverlay', 'reauthBottomSheet');
        }

        function processReauthAndDelete() {
            const user = auth.currentUser;
            if (!user) {
                showToast("로그인 사용자 정보를 찾을 수 없습니다.");
                return;
            }

            const inputId = document.getElementById('reauthId').value.trim();
            let inputPw = document.getElementById('reauthPw').value.trim();

            if (!inputId) {
                showToast("유투엠 아이디를 입력해 주세요.");
                return;
            }
            if (!inputPw) {
                showToast("전화번호 뒷자리 4자리를 입력해 주세요.");
                return;
            }

            // 시스템 연동 처리 (내부 처리용 접미사 연동)
            const email = inputId.includes('@') ? inputId : `${inputId}@knp.com`;

            if (/^\d{4}$/.test(inputPw)) {
                inputPw = "00" + inputPw;
            }

            const credential = firebase.auth.EmailAuthProvider.credential(email, inputPw);

            closeBottomSheet('reauthBottomSheetOverlay', 'reauthBottomSheet');
            document.getElementById('loadingText').innerHTML = "본인 인증 확인 및 회원 탈퇴를<br>진행하는 중입니다...";
            document.getElementById('dataLoadingOverlay').style.display = 'flex';

            user.reauthenticateWithCredential(credential)
                .then(() => {
                    return database.ref(`students/${user.uid}`).remove();
                })
                .then(() => {
                    return user.delete();
                })
                .then(() => {
                    document.getElementById('dataLoadingOverlay').style.display = 'none';
                    localStorage.clear();
                    alert("회원 탈퇴가 안전하게 완료되었습니다.");
                    window.location.replace('login.html');
                })
                .catch((error) => {
                    document.getElementById('dataLoadingOverlay').style.display = 'none';
                    console.error("재인증 및 탈퇴 실패:", error);
                    
                    const errStr = JSON.stringify(error);
                    if (error.code === 'auth/wrong-password' || 
                        error.code === 'auth/user-not-found' || 
                        errStr.includes('INVALID_LOGIN_CREDENTIALS')) {
                        alert("아이디 또는 부모님 전화번호 뒷자리 4자리가 올바르지 않습니다.");
                    } else if (error.code === 'auth/invalid-email') {
                        alert("올바르지 않은 아이디 형식입니다.");
                    } else {
                        alert("인증 실패: " + (error.message || "입력 정보를 다시 확인해 주세요."));
                    }
                    openDeleteBottomSheet();
                });
        }
    </script>
</body>
</html>
