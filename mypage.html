<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P 수학입시학원 My Page</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Font Awesome (눈 모양 아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 1. Paperozi 및 Flight Sans 폰트 */
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; 
            font-display: swap;
        }
        @font-face {
            font-family: 'FlightSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/FlightSans-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            font-family: 'Paperozi', 'FlightSans', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            background-blend-mode: multiply; 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            color: #333; 
            overflow-x: hidden; 
            padding: 40px 0;
            box-sizing: border-box;
        }
        
        .container { 
            width: 100%; 
            max-width: 430px; 
            padding: 24px; 
            box-sizing: border-box; 
        }

        .header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .close-btn {
            font-size: 1.6rem;
            color: #718096;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            font-weight: bold;
            background: none;
            border: none;
            padding: 5px;
            line-height: 1;
        }
        .close-btn:hover {
            color: #6c5ce7;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.4);
            padding: 24px 20px;
            border-radius: 24px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(149, 157, 165, 0.08);
            margin-bottom: 20px;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 18px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        .input-wrapper:last-child {
            margin-bottom: 0;
        }
        .input-wrapper label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        /* 비밀번호 눈모양 아이콘 인풋 스타일 */
        .input-pw {
            position: relative;
            width: 100%;
        }
        .input-pw input {
            padding-right: 45px !important;
        }
        .input-pw .eyes {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            transition: color 0.2s;
            user-select: none;
        }
        .input-pw .eyes:hover {
            color: #6c5ce7;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.01);
            transition: all 0.2s ease;
            color: #2c3e50;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
        }

        .section-divider {
            border-top: 1px dashed rgba(108, 92, 231, 0.3);
            margin: 24px 0 20px 0;
            position: relative;
        }
        .section-title {
            font-size: 0.8rem; color: #6c5ce7; font-weight: bold;
            background: #f0eefc; padding: 4px 10px; border-radius: 20px;
            position: absolute; top: -12px; left: 10px;
        }

        .autocomplete-list {
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px; 
            max-height: 180px; 
            overflow-y: auto;
            border: 1px solid rgba(108, 92, 231, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            z-index: 1000; 
            margin-top: 6px;
            padding: 0;
            list-style: none;
            backdrop-filter: blur(10px);
        }
        .autocomplete-item {
            padding: 12px 16px; 
            cursor: pointer; 
            font-size: 0.9rem;
            color: #333; 
            border-bottom: 1px solid rgba(0,0,0,0.03);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { 
            background: rgba(108, 92, 231, 0.08); 
            color: #6c5ce7; 
            font-weight: 600; 
        }
        .autocomplete-item .school-region { 
            font-size: 0.75rem; 
            color: #7f8c8d; 
            font-weight: normal; 
        }

        .delete-account-zone {
            margin-top: 35px;
            text-align: center;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }
        .delete-btn:hover {
            color: #e53e3e;
        }

        /* 토스트 알림 UI */
        .toast-container {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }
        .toast-message {
            background: rgba(44, 62, 80, 0.92);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            white-space: nowrap;
        }
        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 로딩 모달 */
        .modal-overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(245, 247, 250, 0.65); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            justify-content: center; 
            align-items: center;
        }
        
        #dataLoadingOverlay {
            display: flex;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.1);
            backdrop-filter: blur(10px);
            max-width: 300px;
            width: 80%;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(108, 92, 231, 0.15);
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 0.85s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin: 0 auto 18px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: -0.2px;
            word-break: keep-all;
            line-height: 1.45;
        }

        .modal-box {
            background: #ffffff; 
            width: 90%; 
            max-width: 380px; 
            padding: 30px 24px;
            border-radius: 24px; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            box-sizing: border-box;
        }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #6c5ce7; margin-bottom: 15px; }
        .modal-content { font-size: 1rem; color: #4a5568; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; word-break: keep-all; }
        .modal-btn { background-color: #6c5ce7; color: #ffffff; border: none; padding: 12px 30px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; }
        .btn-flex-group { display: flex; gap: 8px; }
        .btn-cancel { background-color: #e2e8f0; color: #4a5568; width: 100%; border: none; padding: 12px 0; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .btn-cancel:hover { background-color: #cbd5e1; }
        .hidden { display: none !important; }

        /* 바텀시트 UI */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .bottom-sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 9999;
            transition: bottom 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .bottom-sheet.active {
            bottom: 0;
        }
        .sheet-handle {
            width: 40px;
            height: 5px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 0 auto 16px auto;
        }
        .sheet-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .sheet-desc {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .sheet-desc span {
            color: #6c5ce7;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- index.html 스타일 맞춤 로딩 화면 -->
    <div id="dataLoadingOverlay" class="modal-overlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text">학생 데이터를 안전하게<br>불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 토스트 메시지 -->
    <div class="toast-container">
        <div id="toastMessage" class="toast-message"></div>
    </div>

    <div class="container">
        <div class="header-zone">
            <div class="page-title">⚙️ 학생 정보 수정</div>
            <button onclick="location.href='index.html'" class="close-btn" title="홈으로 돌아가기">✕</button>
        </div>

        <div class="form-container">
            <div class="input-wrapper">
                <label for="studentName">학생 이름</label>
                <input type="text" id="studentName" placeholder="이름을 입력해 주세요.">
            </div>
            
            <div class="input-wrapper">
                <label for="schoolName">소속 학교</label>
                <input type="text" id="schoolName" placeholder="예: 무원중" autocomplete="off">
                <div id="schoolList" class="autocomplete-list hidden"></div>
                <input type="hidden" id="schoolCode"> 
            </div>

            <div class="input-wrapper">
                <label for="teacherName">담당 선생님 선택</label>
                <select id="teacherName">
                    <option value="" disabled selected>담당 선생님을 선택해 주세요</option>
                    <option value="김동진">김동진 선생님</option>
                    <option value="이주희">이주희 선생님</option>
                    <option value="차현준">차현준 선생님</option>
                    <option value="권준수">권준수 선생님</option>
                    <option value="박다희">박다희 선생님</option>
                    <option value="정찬호">정찬호 선생님</option>
                    <option value="김영호">김영호 선생님</option>
                </select>
            </div>
        </div>

        <div class="form-container">
            <div class="input-wrapper">
                <label for="u2mId">유투엠 아이디</label>
                <input type="text" id="u2mId" placeholder="유투엠 아이디 입력">
            </div>
            <div class="input-wrapper">
                <label for="u2mPhone">부모님 전화번호 뒷자리 (4자리)</label>
                <div class="input-pw">
                    <input type="password" id="u2mPhone" placeholder="숫자 4자리 입력" maxlength="4" inputmode="numeric">
                    <div class="eyes" onclick="togglePasswordVisibility('u2mPhone', this)">
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-container">
            <div class="section-divider">
                <span class="section-title">매쓰플랫 연동 정보</span>
            </div>
            <div class="input-wrapper">
                <label for="mathflatId">매쓰플랫 아이디 (학생 전화번호)</label>
                <input type="text" id="mathflatId" placeholder="하이픈(-) 없이 숫자만 입력" inputmode="numeric">
            </div>
            <div class="input-wrapper">
                <label for="mathflatPw">매쓰플랫 비밀번호</label>
                <div class="input-pw">
                    <input type="password" id="mathflatPw" placeholder="매쓰플랫 학생용 비밀번호">
                    <div class="eyes" onclick="togglePasswordVisibility('mathflatPw', this)">
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="delete-account-zone">
            <button onclick="openDeleteModal()" class="delete-btn">학원 앱 서비스 회원 탈퇴</button>
        </div>
    </div>

    <!-- 유투엠 아이디 변경 재확인 바텀시트 -->
    <div id="u2mBottomSheetOverlay" class="bottom-sheet-overlay" onclick="cancelU2mIdChange()"></div>
    <div id="u2mBottomSheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">아이디 변경 재확인</div>
        <div class="sheet-desc">
            유투엠 아이디를 <span id="newU2mIdText"></span>(으)로 변경하시겠습니까?
        </div>
        <div class="btn-flex-group">
            <button class="btn-cancel" onclick="cancelU2mIdChange()">취소</button>
            <button class="modal-btn" onclick="confirmU2mIdChange()">확인 및 변경</button>
        </div>
    </div>

    <!-- 회원 탈퇴 모달 -->
    <div id="deleteCheckModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" style="color: #e53e3e;">⚠️ 정말 탈퇴하시겠습니까?</div>
            <div class="modal-content">회원 탈퇴 시 등록된 계정 정보가 영구히 삭제되며 복구할 수 없습니다.</div>
            <div class="btn-flex-group">
                <button class="btn-cancel" onclick="closeModal('deleteCheckModal')">취소</button>
                <button class="modal-btn" onclick="confirmDeleteAccount()" style="background-color: #e53e3e;">탈퇴 확정</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
            authDomain: "ksthome-76889.firebaseapp.com",
            databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
            projectId: "ksthome-76889",
            storageBucket: "ksthome-76889.firebasestorage.app",
            messagingSenderId: "411945142173",
            appId: "1:411945142173:web:c6fdb499040b2a5a4f9174",
            measurementId: "G-72TJ0364MJ"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        const SECRET_SALT = "u2mkst!"; 
        const NEIS_API_KEY = "19f78fd07bfb4243a6333e7bf4641bfc"; 

        let autoSaveTimer = null;
        let isInitialLoad = true;
        let originalU2mId = ""; // 기존 u2mId 백업용
        let pendingU2mId = "";  // 변경 시도 u2mId

        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 비밀번호 보이기/숨기기 토글
        function togglePasswordVisibility(inputId, eyeBtn) {
            const input = document.getElementById(inputId);
            const icon = eyeBtn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function decryptAES(cipherText) {
            if (!cipherText) return "";
            try {
                const cleanCipherText = String(cipherText).trim();
                if (!cleanCipherText.startsWith("U2FsdGVkX1")) return cleanCipherText;
                const bytes = CryptoJS.AES.decrypt(cleanCipherText, SECRET_SALT);
                return bytes.toString(CryptoJS.enc.Utf8) || cleanCipherText; 
            } catch (e) {
                console.error("🚨 복호화 에러:", e);
                return String(cipherText); 
            }
        }

        function encryptAES(plainText) {
            if (plainText === null || plainText === undefined) return "";
            const textString = String(plainText).trim();
            return CryptoJS.AES.encrypt(textString, SECRET_SALT).toString();
        }

        const schoolInput = document.getElementById('schoolName');
        const schoolList = document.getElementById('schoolList');
        const schoolCodeInput = document.getElementById('schoolCode');

        schoolInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
                schoolCodeInput.value = '';
                return;
            }

            const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_API_KEY}&Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    schoolList.innerHTML = '';
                    if (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) {
                        const rows = data.schoolInfo[1].row;
                        schoolList.classList.remove('hidden');
                        rows.forEach(item => {
                            const li = document.createElement('li');
                            li.className = 'autocomplete-item';
                            li.innerHTML = `${item.SCHUL_NM} <span class="school-region">${item.ATPT_OFCDC_SC_NM}</span>`;
                            li.addEventListener('click', () => {
                                schoolInput.value = item.SCHUL_NM;
                                schoolCodeInput.value = item.SD_SCHUL_CODE;
                                schoolList.innerHTML = '';
                                schoolList.classList.add('hidden');
                                triggerAutoSave();
                            });
                            schoolList.appendChild(li);
                        });
                    } else {
                        schoolList.classList.add('hidden');
                    }
                })
                .catch(err => { console.error(err); });
        });

        document.addEventListener('click', function(e) {
            if (e.target !== schoolInput && e.target !== schoolList) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
            }
        });

        window.onload = function() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    database.ref(`students/${user.uid}`).once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            document.getElementById('studentName').value = decryptAES(data.name);
                            document.getElementById('schoolName').value = data.schoolName || '';
                            document.getElementById('schoolCode').value = data.schoolCode || '';
                            
                            if (data.teacher) {
                                document.getElementById('teacherName').value = data.teacher;
                            }
                            
                            originalU2mId = data.u2mId || '';
                            document.getElementById('u2mId').value = originalU2mId;
                            document.getElementById('u2mPhone').value = decryptAES(data.phone);
                            
                            const rawMathflatId = data.studentPhone ? decryptAES(data.studentPhone) : (data.mathflatId || '');
                            document.getElementById('mathflatId').value = rawMathflatId;
                            
                            document.getElementById('mathflatPw').value = decryptAES(data.mathflatPw);
                            
                            document.getElementById('dataLoadingOverlay').style.display = 'none';
                            
                            bindAutoSaveEvents();
                            setTimeout(() => {
                                isInitialLoad = false;
                            }, 300);
                        } else {
                            document.getElementById('dataLoadingOverlay').style.display = 'none';
                            showToast("학생 데이터를 찾을 수 없습니다.");
                            setTimeout(() => { window.location.replace('login.html'); }, 1500);
                        }
                    });
                } else {
                    window.location.replace('login.html');
                }
            });
        };

        // 입력 이벤트 바인딩
        function bindAutoSaveEvents() {
            const inputs = ['studentName', 'schoolName', 'teacherName', 'u2mPhone', 'mathflatId', 'mathflatPw'];
            inputs.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('input', triggerAutoSave);
                    element.addEventListener('change', triggerAutoSave);
                    element.addEventListener('blur', triggerAutoSave);
                }
            });

            // 유투엠 아이디는 변경 시 바텀시트 확인 절차 진행
            const u2mInput = document.getElementById('u2mId');
            if (u2mInput) {
                u2mInput.addEventListener('change', handleU2mIdChange);
                u2mInput.addEventListener('blur', handleU2mIdChange);
            }
        }

        // U2M ID 변경 감지 및 바텀시트 호출
        function handleU2mIdChange() {
            if (isInitialLoad) return;
            const currentVal = document.getElementById('u2mId').value.trim();
            if (currentVal !== originalU2mId && currentVal.length > 0) {
                pendingU2mId = currentVal;
                document.getElementById('newU2mIdText').innerText = `'${pendingU2mId}'`;
                openBottomSheet();
            }
        }

        function openBottomSheet() {
            document.getElementById('u2mBottomSheetOverlay').classList.add('active');
            document.getElementById('u2mBottomSheet').classList.add('active');
        }

        function closeBottomSheet() {
            document.getElementById('u2mBottomSheetOverlay').classList.remove('active');
            document.getElementById('u2mBottomSheet').classList.remove('active');
        }

        // 바텀시트 확인 클릭 시 실제 저장
        function confirmU2mIdChange() {
            closeBottomSheet();
            const user = auth.currentUser;
            if (!user) return;

            database.ref(`students/${user.uid}`).update({ u2mId: pendingU2mId })
                .then(() => {
                    originalU2mId = pendingU2mId;
                    showToast("💾 유투엠 아이디가 성공적으로 변경되었습니다.");
                })
                .catch((err) => {
                    console.error(err);
                    showToast("❌ 유투엠 아이디 변경 실패");
                    document.getElementById('u2mId').value = originalU2mId;
                });
        }

        // 취소 시 기존 아이디로 복원
        function cancelU2mIdChange() {
            closeBottomSheet();
            document.getElementById('u2mId').value = originalU2mId;
        }

        function triggerAutoSave() {
            if (isInitialLoad) return;
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                updateStudentProfileAuto();
            }, 700);
        }

        function updateStudentProfileAuto() {
            const user = auth.currentUser;
            if (!user) return;

            const studentName = document.getElementById('studentName').value.trim();
            const schoolName = document.getElementById('schoolName').value.trim();
            const schoolCode = document.getElementById('schoolCode').value.trim();
            const selectedTeacher = document.getElementById('teacherName').value;
            const phoneTail = document.getElementById('u2mPhone').value.trim();
            const mathflatPhone = document.getElementById('mathflatId').value.trim().replace(/[^0-9]/g, '');
            const mathflatPw = document.getElementById('mathflatPw').value.trim();

            const updatedObject = {};

            if (studentName) updatedObject.name = encryptAES(studentName);
            if (schoolName) updatedObject.schoolName = schoolName;
            if (schoolCode) updatedObject.schoolCode = schoolCode;
            if (selectedTeacher) updatedObject.teacher = selectedTeacher;
            if (phoneTail) updatedObject.phone = encryptAES(phoneTail);
            if (mathflatPhone) {
                updatedObject.studentPhone = encryptAES(mathflatPhone);
                updatedObject.mathflatId = mathflatPhone;
            }
            if (mathflatPw) updatedObject.mathflatPw = encryptAES(mathflatPw);

            if (Object.keys(updatedObject).length === 0) return;

            database.ref(`students/${user.uid}`).update(updatedObject)
                .then(() => {
                    if (phoneTail) {
                        const studentPassword = "00" + phoneTail; 
                        localStorage.setItem('u2m_pw', studentPassword);
                    }
                    showToast("💾 변경사항이 자동으로 저장되었습니다.");
                })
                .catch((err) => {
                    console.error("자동 저장 실패:", err);
                    showToast("❌ 저장 실패: 네트워크 상태를 확인하세요.");
                });
        }

        function openDeleteModal() { showModal('deleteCheckModal'); }
        function confirmDeleteAccount() {
            const user = auth.currentUser;
            if (!user) return;
            closeModal('deleteCheckModal');
            document.getElementById('dataLoadingOverlay').style.display = 'flex';
            database.ref(`students/${user.uid}`).remove()
                .then(() => { return user.delete(); })
                .then(() => {
                    document.getElementById('dataLoadingOverlay').style.display = 'none';
                    localStorage.clear();
                    alert("회원 탈퇴가 완료되었습니다.");
                    window.location.replace('login.html');
                })
                .catch((error) => {
                    document.getElementById('dataLoadingOverlay').style.display = 'none';
                    showToast("탈퇴 실패: " + error.message);
                });
        }
    </script>
</body>
</html>
