<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P 수학입시학원 마이페이지</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; 
            font-display: swap;
        }
        
        body {
            font-family: 'Paperlogy', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            background-blend-mode: multiply; 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            color: #333; 
            overflow-x: hidden; 
            padding: 40px 0;
            box-sizing: border-box;
        }
        
        .container { 
            width: 100%; 
            max-width: 430px; 
            padding: 24px; 
            box-sizing: border-box; 
        }

        /* 상단 헤더 영역 */
        .header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .close-btn {
            font-size: 1.6rem;
            color: #718096;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            font-weight: bold;
            background: none;
            border: none;
            padding: 5px;
            line-height: 1;
        }
        .close-btn:hover {
            color: #6c5ce7;
        }

        /* 입력 폼 스타일 */
        .form-container {
            background: rgba(255, 255, 255, 0.4);
            padding: 24px 20px;
            border-radius: 24px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(149, 157, 165, 0.08);
            margin-bottom: 20px;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 18px;
            width: 100%;
            box-sizing: border-box;
        }
        .input-wrapper:last-child {
            margin-bottom: 0;
        }
        .input-wrapper label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.01);
            transition: all 0.2s ease;
            color: #2c3e50;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
        }

        /* 하단 고정 버튼 세트 */
        .submit-btn {
            display: block; 
            background-color: #6c5ce7; 
            color: #ffffff;
            border: none;
            padding: 18px 20px; 
            border-radius: 16px;
            font-size: 1.05rem; 
            font-weight: 600; 
            box-shadow: 0 8px 16px rgba(108, 92, 231, 0.25);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            cursor: pointer; 
            box-sizing: border-box; 
            width: 100%; 
            text-align: center; 
            font-family: inherit;
            margin-top: 25px;
        }
        .submit-btn:hover { 
            transform: translateY(-2px); 
            background-color: #5b4cc4; 
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.35);
        }

        .delete-account-zone {
            margin-top: 35px;
            text-align: center;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }
        .delete-btn:hover {
            color: #e53e3e;
        }

        /* 모달 레이아웃 */
        .modal-overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(4px); 
            z-index: 1000;
            justify-content: center; 
            align-items: center;
        }
        .modal-box {
            background: #ffffff; 
            width: 90%; 
            max-width: 380px; 
            padding: 30px 24px;
            border-radius: 24px; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            box-sizing: border-box;
        }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #6c5ce7; margin-bottom: 15px; }
        .modal-content { font-size: 1rem; color: #4a5568; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; word-break: keep-all; }
        .modal-btn { background-color: #6c5ce7; color: #ffffff; border: none; padding: 12px 30px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; }
        .btn-flex-group { display: flex; gap: 8px; }
        .btn-cancel { background-color: #e2e8f0; color: #4a5568; width: 100%; border: none; padding: 12px 0; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .btn-cancel:hover { background-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 영역 (홈으로 돌아가는 X 버튼) -->
        <div class="header-zone">
            <div class="page-title">⚙️ 학생 정보 수정</div>
            <button onclick="location.href='index.html'" class="close-btn" title="홈으로 돌아가기">✕</button>
        </div>

        <!-- 기본 정보 섹션 -->
        <div class="form-container">
            <div class="input-wrapper">
                <label for="studentName">학생 이름</label>
                <input type="text" id="studentName" placeholder="이름을 입력해 주세요.">
            </div>
            <div class="input-wrapper">
                <label for="schoolName">학교명</label>
                <input type="text" id="schoolName" placeholder="예: 무원고등학교, 화정초등학교">
            </div>
            <div class="input-wrapper">
                <label for="teacherName">담당 선생님 이름</label>
                <input type="text" id="teacherName" placeholder="담당 선생님 성함을 입력해 주세요.">
            </div>
        </div>

        <!-- 계정 연동 정보 섹션 -->
        <div class="form-container">
            <div class="input-wrapper">
                <label for="u2mId">유투엠 아이디</label>
                <input type="text" id="u2mId" placeholder="유투엠 홈페이지 아이디">
            </div>
            <div class="input-wrapper">
                <label for="u2mPhone">유투엠 연동 전화번호</label>
                <input type="text" id="u2mPhone" placeholder="하이픈(-) 없이 숫자만 입력">
            </div>
            <div class="input-wrapper">
                <label for="studentPhone">학생 본인 전화번호</label>
                <input type="text" id="studentPhone" placeholder="하이픈(-) 없이 숫자만 입력">
            </div>
        </div>

        <!-- 매쓰플랫 정보 섹션 -->
        <div class="form-container">
            <div class="input-wrapper">
                <label for="mathflatId">매쓰플랫 아이디</label>
                <input type="text" id="mathflatId" placeholder="매쓰플랫 학생용 아이디">
            </div>
            <div class="input-wrapper">
                <label for="mathflatPw">매쓰플랫 비밀번호</label>
                <input type="password" id="mathflatPw" style="width:100%; padding:14px; border:1px solid rgba(255,255,255,0.7); border-radius:14px; box-sizing:border-box; font-size:0.95rem; background:rgba(255,255,255,0.7); color:#2c3e50; font-family:inherit;" placeholder="매쓰플랫 학생용 비밀번호">
            </div>
        </div>

        <!-- 저장 버튼 -->
        <button onclick="updateStudentProfile()" class="submit-btn">변경사항 저장하기</button>

        <!-- 회원 탈퇴 영역 -->
        <div class="delete-account-zone">
            <button onclick="openDeleteModal()" class="delete-btn">학원 앱 서비스 회원 탈퇴</button>
        </div>
    </div>

    <!-- 1. 커스텀 알림(Alert) 모달 -->
    <div id="customAlertModal" class="modal-overlay">
        <div class="modal-box">
            <div id="customAlertTitle" class="modal-title">💡 알림</div>
            <div id="customAlertContent" class="modal-content">내용</div>
            <button class="modal-btn" onclick="closeCustomAlert()">확인</button>
        </div>
    </div>

    <!-- 2. 회원 탈퇴 확인 모달 -->
    <div id="deleteCheckModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" style="color: #e53e3e;">⚠️ 정말 탈퇴하시겠습니까?</div>
            <div class="modal-content">회원 탈퇴 시 등록된 계정 정보, 메시지 전송 내역이 Firebase 실시간 데이터베이스에서 영구히 삭제되며 복구할 수 없습니다.</div>
            <div class="btn-flex-group">
                <button class="btn-cancel" onclick="closeModal('deleteCheckModal')">취소</button>
                <button class="modal-btn" onclick="confirmDeleteAccount()" style="background-color: #e53e3e;">탈퇴 확정</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_KEY = "u2mkst!";
        let customAlertCallback = null;

        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showCustomAlert(content, title = "💡 알림", callback = null) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertContent').innerText = content;
            customAlertCallback = callback;
            showModal('customAlertModal');
        }

        function closeCustomAlert() {
            closeModal('customAlertModal');
            if (customAlertCallback && typeof customAlertCallback === 'function') {
                customAlertCallback();
                customAlertCallback = null;
            }
        }

        // AES 복호화 함수
        function decryptAES(cipherText) {
            if (!cipherText) return "";
            try {
                const cleanCipherText = cipherText.toString().trim();
                if (!cleanCipherText.startsWith("U2FsdGVkX1")) return cleanCipherText;
                const bytes = CryptoJS.AES.decrypt(cleanCipherText, SECRET_KEY);
                return bytes.toString(CryptoJS.enc.Utf8) || cleanCipherText; 
            } catch (e) {
                console.error("🚨 복호화 에러:", e);
                return cipherText; 
            }
        }

        // AES 암호화 함수
        function encryptAES(plainText) {
            if (!plainText) return "";
            return CryptoJS.AES.encrypt(plainText.trim(), SECRET_KEY).toString();
        }

        // 파이어베이스 설정 초기화 (index.html과 동일해야 함)
        const firebaseConfig = {
            apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
            authDomain: "ksthome-76889.firebaseapp.com",
            databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
            projectId: "ksthome-76889",
            storageBucket: "ksthome-76889.firebasestorage.app",
            messagingSenderId: "411945142173",
            appId: "1:411945142173:web:c6fdb499040b2a5a4f9174",
            measurementId: "G-72TJ0364MJ"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // 페이지 로드 시 로그인 상태 감지 및 기존 정보 로드
        window.onload = function() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    database.ref(`students/${user.uid}`).once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            // 복호화하여 인풋 필드에 세팅
                            const rawName = data.name || data.studentName || data.userName || '';
                            document.getElementById('studentName').value = decryptAES(rawName);
                            document.getElementById('schoolName').value = data.schoolName || '';
                            document.getElementById('teacherName').value = data.teacher || '';
                            document.getElementById('u2mId').value = data.u2mId || '';
                            document.getElementById('u2mPhone').value = decryptAES(data.phone);
                            document.getElementById('studentPhone').value = decryptAES(data.studentPhone);
                            document.getElementById('mathflatId').value = data.mathflatId || '';
                            document.getElementById('mathflatPw').value = decryptAES(data.mathflatPw);
                        } else {
                            showCustomAlert("등록된 학생 데이터를 찾을 수 없습니다.", "❌ 오류", () => {
                                window.location.replace('login.html');
                            });
                        }
                    });
                } else {
                    window.location.replace('login.html');
                }
            });
        };

        // 데이터베이스 정보 업데이트 함수
        function updateStudentProfile() {
            const user = auth.currentUser;
            if (!user) { showCustomAlert("세션이 만료되었습니다. 다시 로그인 해주세요."); return; }

            const name = document.getElementById('studentName').value.trim();
            const schoolName = document.getElementById('schoolName').value.trim();
            const teacher = document.getElementById('teacherName').value.trim();
            const u2mId = document.getElementById('u2mId').value.trim();
            const u2mPhone = document.getElementById('u2mPhone').value.trim().replace(/[^0-9]/g, "");
            const studentPhone = document.getElementById('studentPhone').value.trim().replace(/[^0-9]/g, "");
            const mathflatId = document.getElementById('mathflatId').value.trim();
            const mathflatPw = document.getElementById('mathflatPw').value.trim();

            if (!name || !schoolName || !teacher || !u2mId || !u2mPhone || !studentPhone || !mathflatId || !mathflatPw) {
                showCustomAlert("모든 빈칸 항목을 누락 없이 입력해 주세요.");
                return;
            }

            // 민감 정보 규정에 따른 대칭 키 실시간 대형 암호화 작업
            const encryptedName = encryptAES(name);
            const encryptedU2mPhone = encryptAES(u2mPhone);
            const encryptedStudentPhone = encryptAES(studentPhone);
            const encryptedMathflatPw = encryptAES(mathflatPw);

            const updatedObject = {
                name: encryptedName,
                schoolName: schoolName,
                teacher: teacher,
                u2mId: u2mId,
                phone: encryptedU2mPhone,
                studentPhone: encryptedStudentPhone,
                mathflatId: mathflatId,
                mathflatPw: encryptedMathflatPw
            };

            database.ref(`students/${user.uid}`).update(updatedObject)
                .then(() => {
                    showCustomAlert("모든 학생 가입 정보가 성공적으로 변경되었습니다!", "⚙️ 수정 완료", () => {
                        window.location.href = 'index.html';
                    });
                })
                .catch((err) => {
                    showCustomAlert("정보 수정을 실패했습니다: " + err.message, "❌ 에러");
                });
        }

        // 탈퇴 관련 함수 그룹
        function openDeleteModal() { showModal('deleteCheckModal'); }
        
        function confirmDeleteAccount() {
            const user = auth.currentUser;
            if (!user) return;

            closeModal('deleteCheckModal');

            // 1. 실시간 데이터베이스(RTDB) 정보 노드 즉시 삭제
            database.ref(`students/${user.uid}`).remove()
                .then(() => {
                    // 2. 파이어베이스 인증(Authentication) 서버 계정 영구 삭제
                    return user.delete();
                })
                .then(() => {
                    localStorage.removeItem('u2m_id');
                    localStorage.removeItem('u2m_pw');
                    alert("그동안 서비스를 이용해 주셔서 감사합니다. 회원 탈퇴가 최종 정상 처리되었습니다.");
                    window.location.replace('login.html');
                })
                .catch((error) => {
                    console.error(error);
                    if (error.code === 'auth/requires-recent-login') {
                        showCustomAlert("보안을 위해 최근 로그인 기록이 필요합니다. 로그아웃 후 다시 로그인하여 탈퇴를 진행해 주세요.", "🔒 보안 인증 필요");
                    } else {
                        showCustomAlert("탈퇴 처리 도중 오류가 발생했습니다: " + error.message, "❌ 에러");
                    }
                });
        }
    </script>
</body>
</html>
