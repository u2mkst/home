<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 순위 & 랭킹 - K&P 수학입시학원</title>
    
    <!-- 에셋 및 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; font-display: swap;
        }
        @font-face {
            font-family: 'FlightSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/FlightSans-Bold.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }
        
        html { font-size: 14px; }
        * { font-family: 'FlightSans', 'Paperlogy', 'Noto Sans KR', 'Mona12', sans-serif; }
        .emoji-font { font-family: 'Mona12', sans-serif !important; font-weight: normal !important; }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            background-blend-mode: multiply; margin: 0; display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: #1d1d1f; box-sizing: border-box; padding: 24px 20px 110px 20px; overflow-x: hidden;
        }
        
        .container { width: 100%; max-width: 960px; margin: 0 auto; }
        
        .header-zone { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-family: 'Paperlogy', sans-serif; font-size: 1.65rem; font-weight: 700; color: #1d1d1f; margin: 0; }

        .glass-card {
            background: rgba(255, 255, 255, 0.52); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.65); 
            border-radius: 22px; padding: 22px 24px;
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.03), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            box-sizing: border-box; transition: all 0.3s ease;
        }

        /* 📱 하단 불투명 플로팅 바 (Dock Bar) */
        .floating-bottom-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 460px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px; padding: 6px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            display: flex; gap: 6px; z-index: 9999;
        }

        .nav-dock-btn {
            flex: 1; padding: 12px 16px; border-radius: 24px;
            font-family: 'Paperlogy', sans-serif; font-size: 0.95rem; font-weight: 700;
            color: #666; border: none; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-dock-btn.active {
            background: #6c5ce7; color: #ffffff;
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
        }

        /* 레이아웃 분할 (태블릿 이상일 때 2컬럼) */
        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .content-grid { grid-template-columns: 1fr 1fr; } }

        /* 랭킹 리스트 */
        .rank-list { display: flex; flex-direction: column; gap: 8px; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 15px; background: rgba(255, 255, 255, 0.6); border-radius: 14px;
            font-size: 0.92rem; border: 1px solid rgba(255, 255, 255, 0.75);
        }
        .rank-item.my-rank {
            background: rgba(108, 92, 231, 0.12); border: 1.5px solid #6c5ce7; font-weight: 700;
        }
        .rank-badge {
            width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.8rem; font-weight: 700; color: #fff; background: #a1a1a6; flex-shrink: 0;
        }
        .rank-1 { background: #ffd700; color: #1d1d1f; }
        .rank-2 { background: #c0c0c0; color: #1d1d1f; }
        .rank-3 { background: #cd7f32; color: #fff; }

        .student-info-sub { font-size: 0.75rem; color: #666; font-weight: 500; margin-top: 2px; }

        /* 슬림 달력 디자인 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .calendar-day-head { font-size: 0.72rem; font-weight: 700; color: #86868b; padding: 2px 0; }
        .calendar-day {
            padding: 6px 0; font-size: 0.82rem; border-radius: 9px; background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center;
        }
        .calendar-day.attended {
            background: #6c5ce7; color: #ffffff; font-weight: 700;
            box-shadow: 0 3px 8px rgba(108, 92, 231, 0.3); border-color: #6c5ce7;
        }

        /* 로또 공 디자인 */
        .lotto-ball {
            width: 32px; height: 32px; border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center; font-weight: 700; color: #fff;
            font-size: 0.85rem; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.08); flex-shrink: 0;
        }
        .ball-yellow { background: #fbc531; color: #1d1d1f; }
        .ball-blue { background: #00a8ff; }
        .ball-red { background: #e84118; }
        .ball-gray { background: #718093; }
        .ball-green { background: #4cd137; }

        /* 3D 번호 입력 볼 */
        .lotto-ball-input {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.88);
            border: 2px solid rgba(220, 220, 230, 0.85);
            text-align: center; font-weight: 800; font-size: 1rem; color: #333;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -moz-appearance: textfield;
        }
        .lotto-ball-input::-webkit-outer-spin-button,
        .lotto-ball-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .lotto-ball-input:focus {
            outline: none; border-color: #6c5ce7; background: #ffffff;
            transform: scale(1.08); box-shadow: 0 0 12px rgba(108, 92, 231, 0.35);
        }
        .lotto-ball-input.bonus-style {
            border-color: #a29bfe; background: rgba(243, 240, 255, 0.9);
        }

        .btn-base {
            font-family: 'Paperlogy', sans-serif; font-size: 0.95rem; font-weight: 700;
            padding: 12px 18px; border-radius: 14px; transition: all 0.25s ease;
            cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-primary { background-color: #6c5ce7; color: #ffffff; box-shadow: 0 6px 16px rgba(108, 92, 231, 0.25); }
        .btn-primary:hover { background-color: #5b4bc4; transform: translateY(-1px); }
        .btn-secondary { background-color: rgba(255, 255, 255, 0.7); color: #4a5568; border: 1px solid rgba(255,255,255,0.85); }

        .toast-container {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(29, 29, 31, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #ffffff; padding: 12px 24px; border-radius: 30px; font-family: 'Paperlogy', sans-serif;
            font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 100000;
            opacity: 0; visibility: hidden; transition: all 0.35s ease; pointer-events: none;
        }
        .toast-container.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toastNotification" class="toast-container"><span id="toastMessage"></span></div>

    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header-zone">

            <button onclick="window.location.href='index.html'" class="btn-base btn-secondary">

        <!-- 1. [이달의 출석] 뷰 -->

                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">

    <!-- 📱 하단 불투명 플로팅 바 (Glassmorphic Dock) -->
    <div class="floating-bottom-bar">
        <button id="nav-btn-attendance" class="nav-dock-btn active" onclick="switchNav('attendance')">
            <span class="emoji-font">📅</span> 이달의 출석
        </button>
        <button id="nav-btn-lotto" class="nav-dock-btn" onclick="switchNav('lotto')">
            <span class="emoji-font">🎰</span> 이주의 로또
        </button>
    </div>

    <script>
    const SECRET_KEY = "u2mkst!";
    const firebaseConfig = {
        apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
        authDomain: "ksthome-76889.firebaseapp.com",
        databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
        projectId: "ksthome-76889",
        storageBucket: "ksthome-76889.firebasestorage.app",
        messagingSenderId: "411945142173",
        appId: "1:411945142173:web:c6fdb499040b2a5a4f9174"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let currentUserUid = null;
    let currentStudentName = "학생";

    function decryptAES(cipherText) {
        if (!cipherText) return "";
        try {
            const clean = cipherText.toString().trim();
            if (!clean.startsWith("U2FsdGVkX1")) return clean;
            const bytes = CryptoJS.AES.decrypt(clean, SECRET_KEY);
            return bytes.toString(CryptoJS.enc.Utf8) || clean;
        } catch (e) { return cipherText; }
    }

    function showToast(msg) {
        const t = document.getElementById('toastNotification');
        document.getElementById('toastMessage').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* 하단 불투명 플로팅 바 내비게이션 전환 */
    function switchNav(tab) {
        document.getElementById('nav-btn-attendance').classList.toggle('active', tab === 'attendance');
        document.getElementById('nav-btn-lotto').classList.toggle('active', tab === 'lotto');
        document.getElementById('view-attendance').style.display = tab === 'attendance' ? 'grid' : 'none';
        document.getElementById('view-lotto').style.display = tab === 'lotto' ? 'grid' : 'none';
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUserUid = user.uid;
            database.ref(`students/${user.uid}`).once('value', snap => {
                const data = snap.val();
                if(data) {
                    const rawName = data.name || data.studentName || data.userName;
                    currentStudentName = rawName ? decryptAES(rawName) : "학생";
                }
                loadAttendanceData();
                loadLottoData();
            });
        } else {
            window.location.replace('login.html');
        }
    });

    /* --- [1. 출석 로직] --- */
    function loadAttendanceData() {
        const now = new Date();
        const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('currentMonthTitle').innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;

        database.ref('attendance').once('value', (snapshot) => {
            const allData = snapshot.val() || {};
            let rankArray = [];

            database.ref('students').once('value', (stdSnap) => {
                const stds = stdSnap.val() || {};

                Object.keys(allData).forEach(uid => {
                    const monthInfo = allData[uid][yearMonth];
                    if (monthInfo) {
                        const count = monthInfo.count || 0;
                        const std = stds[uid] || {};
                        
                        const rawName = std.name || std.studentName || std.userName;
                        const name = rawName ? decryptAES(rawName) : "학생";
                        const school = std.schoolName || "학교 미기재";
                        const teacher = std.teacher ? `${std.teacher} 선생님` : "선생님 미기재";

                        rankArray.push({ uid: uid, name: name, school: school, teacher: teacher, count: count });
                    }
                });

                rankArray.sort((a, b) => b.count - a.count);
                renderAttendanceRank(rankArray);
                renderMyCalendar(allData[currentUserUid] ? allData[currentUserUid][yearMonth] : null, now);
            });
        });
    }

    function renderAttendanceRank(rankArray) {
        const container = document.getElementById('attendanceRankList');
        const myRankContainer = document.getElementById('myAttendanceRankCard');
        container.innerHTML = '';

        if (rankArray.length === 0) {
            container.innerHTML = '<div class="text-center py-6 text-gray-400">이번 달 출석 기록이 없습니다.</div>';
            return;
        }

        let myRankInfo = null;
        let myRankIndex = -1;

        rankArray.forEach((item, idx) => {
            if (item.uid === currentUserUid) {
                myRankInfo = item;
                myRankIndex = idx + 1;
            }

            if (idx < 10) {
                const isMe = item.uid === currentUserUid;
                const badgeClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
                
                const html = `
                    <div class="rank-item ${isMe ? 'my-rank' : ''}">
                        <div class="flex items-center gap-2.5">
                            <div class="rank-badge ${badgeClass}">${idx + 1}</div>
                            <div>
                                <div class="font-bold">${item.name} ${isMe ? '(나)' : ''}</div>
                                <div class="student-info-sub">🏫 ${item.school} | 👨‍🏫 ${item.teacher}</div>
                            </div>
                        </div>
                        <span class="font-extrabold text-indigo-600">${item.count}일</span>
                    </div>`;
                container.innerHTML += html;
            }
        });

        if (myRankInfo) {
            myRankContainer.innerHTML = `
                <div class="rank-item my-rank">
                    <div class="flex items-center gap-2.5">
                        <span class="text-xs bg-indigo-600 text-white font-bold px-2 py-0.5 rounded-md">내 순위</span>
                        <div>
                            <div class="font-bold">${myRankIndex}위 (${myRankInfo.name})</div>
                            <div class="student-info-sub">🏫 ${myRankInfo.school} | 👨‍🏫 ${myRankInfo.teacher}</div>
                        </div>
                    </div>
                    <span class="font-extrabold text-indigo-600">${myRankInfo.count}일</span>
                </div>`;
        }
    }

    function renderMyCalendar(myMonthData, now) {
        const daysContainer = document.getElementById('calendarDays');
        daysContainer.innerHTML = '';

        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = new Date(year, month, 1).getDay();

        const attendedDays = myMonthData && myMonthData.days ? myMonthData.days : {};
        const attCount = Object.keys(attendedDays).length;

        document.getElementById('myAttDays').innerText = `${attCount}일`;
        const rate = Math.round((attCount / daysInMonth) * 100);
        document.getElementById('myAttRate').innerText = `${rate}%`;

        for (let i = 0; i < firstDayIndex; i++) {
            daysContainer.innerHTML += `<div></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isAttended = !!attendedDays[dateStr];
            daysContainer.innerHTML += `<div class="calendar-day ${isAttended ? 'attended' : ''}">${d}</div>`;
        }
    }

    /* --- [2. 로또 로직] --- */
    function loadLottoData() {
        fetch("https://lotto-vzqu.onrender.com/")
            .then(res => res.json())
            .then(resData => {
                if (resData && resData.status === "success" && resData.data) {
                    renderLottoWinningBalls(resData.data.numbers, resData.data.bonusNo);
                }
            })
            .catch(err => {
                document.getElementById('lottoWinningBox').innerHTML = `<span class="text-xs text-red-500 font-bold">당첨 번호를 불러올 수 없습니다.</span>`;
            });

        database.ref('lotto_predictions').once('value', (snapshot) => {
            const predictions = snapshot.val() || {};
            renderLottoRank(predictions);
            checkMyLottoSubmission(predictions[currentUserUid]);
        });
    }

    function getBallColorClass(num) {
        if (num <= 10) return 'ball-yellow';
        if (num <= 20) return 'ball-blue';
        if (num <= 30) return 'ball-red';
        if (num <= 40) return 'ball-gray';
        return 'ball-green';
    }

    function renderLottoWinningBalls(numbers, bonus) {
        const box = document.getElementById('lottoWinningBox');
        box.innerHTML = '';
        numbers.forEach(n => {
            box.innerHTML += `<div class="lotto-ball ${getBallColorClass(n)}">${n}</div>`;
        });
        box.innerHTML += `<span class="font-bold text-gray-400 mx-1">+</span>`;
        box.innerHTML += `<div class="lotto-ball ${getBallColorClass(bonus)}">${bonus}</div>`;
    }

    function renderLottoRank(predictions) {
        const container = document.getElementById('lottoRankList');
        container.innerHTML = '';

        let rankArray = [];
        database.ref('students').once('value', (stdSnap) => {
            const stds = stdSnap.val() || {};
            
            Object.keys(predictions).forEach(uid => {
                const item = predictions[uid];
                const std = stds[uid] || {};

                const rawName = std.name || std.studentName || std.userName;
                const name = rawName ? decryptAES(rawName) : "학생";

                rankArray.push({
                    uid: uid,
                    name: name,
                    school: std.schoolName || "학교 미기재",
                    teacher: std.teacher ? `${std.teacher} 선생님` : "선생님 미기재",
                    matchedCount: item.matchedCount || 0
                });
            });

            rankArray.sort((a, b) => b.matchedCount - a.matchedCount);

            if (rankArray.length === 0) {
                container.innerHTML = '<div class="text-center py-6 text-gray-400">이번 주 예측 참여자가 없습니다.</div>';
                return;
            }

            rankArray.slice(0, 10).forEach((item, idx) => {
                const isMe = item.uid === currentUserUid;
                const badgeClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
                container.innerHTML += `
                    <div class="rank-item ${isMe ? 'my-rank' : ''}">
                        <div class="flex items-center gap-2.5">
                            <div class="rank-badge ${badgeClass}">${idx + 1}</div>
                            <div>
                                <div class="font-bold">${item.name} ${isMe ? '(나)' : ''}</div>
                                <div class="student-info-sub">🏫 ${item.school} | 👨‍🏫 ${item.teacher}</div>
                            </div>
                        </div>
                        <span class="font-extrabold text-indigo-600">${item.matchedCount}개 적중</span>
                    </div>`;
            });
        });
    }

    function checkMyLottoSubmission(myPrediction) {
        const statusBox = document.getElementById('myLottoStatus');
        if (myPrediction) {
            const balls = myPrediction.numbers.map(n => `<div class="lotto-ball ${getBallColorClass(n)}">${n}</div>`).join(' ');
            const bonusBall = myPrediction.bonus ? `<div class="lotto-ball ${getBallColorClass(myPrediction.bonus)}">${myPrediction.bonus}</div>` : '';
            
            statusBox.innerHTML = `
                <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100/80 text-center shadow-sm">
                    <div class="text-xs text-indigo-600 font-bold mb-2">✅ 이번 주 예측 제출 완료</div>
                    <div class="flex justify-center items-center gap-1.5 mt-2 flex-wrap">
                        ${balls}
                        ${bonusBall ? `<span class="font-bold text-gray-400 mx-0.5">+</span> ${bonusBall}` : ''}
                    </div>
                </div>`;
        }
    }

    function generateAutoLotto() {
        let nums = new Set();
        while(nums.size < 7) {
            nums.add(Math.floor(Math.random() * 45) + 1);
        }
        const arr = Array.from(nums);
        const bonus = arr.pop();
        const sorted = arr.sort((a,b) => a-b);

        const inputs = document.querySelectorAll('.lotto-in');
        inputs.forEach((input, idx) => input.value = sorted[idx]);
        document.getElementById('lottoBonusInput').value = bonus;
    }

    function submitLottoPrediction() {
        const inputs = document.querySelectorAll('.lotto-in');
        const bonusInput = document.getElementById('lottoBonusInput');
        
        let selected = [];
        for (let input of inputs) {
            const val = parseInt(input.value);
            if (isNaN(val) || val < 1 || val > 45) {
                showToast("1~45 사이의 숫자를 올바르게 입력해주세요.");
                return;
            }
            selected.push(val);
        }

        const bonusVal = parseInt(bonusInput.value);
        if (isNaN(bonusVal) || bonusVal < 1 || bonusVal > 45) {
            showToast("보너스 번호(1~45)를 입력해주세요.");
            return;
        }

        const totalSet = new Set([...selected, bonusVal]);
        if (totalSet.size !== 7) {
            showToast("중복된 번호가 있습니다. 7개 번호를 모두 다르게 입력해주세요.");
            return;
        }

        selected.sort((a,b) => a-b);

        database.ref(`lotto_predictions/${currentUserUid}`).set({
            studentName: currentStudentName,
            numbers: selected,
            bonus: bonusVal,
            matchedCount: 0,
            submittedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            showToast("🎉 로또 예측 번호 제출 완료!");
            loadLottoData();
        }).catch(err => showToast("제출 실패: " + err.message));
    }
    </script>
</body>
</html>
