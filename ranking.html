<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P 수학입시학원 순위</title>
    
    <!-- 에셋 및 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; font-display: swap;
        }
        @font-face {
            font-family: 'FlightSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/FlightSans-Bold.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }
        
        html { font-size: 15px; }
        * { font-family: 'FlightSans', 'Paperlogy', 'Noto Sans KR', 'Mona12', sans-serif; }
        .emoji-font { font-family: 'Mona12', sans-serif !important; font-weight: normal !important; }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            background-blend-mode: multiply; margin: 0; display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: #1d1d1f; box-sizing: border-box; padding: 40px 36px 120px 36px; overflow-x: hidden;
        }
        
        .container { width: 100%; max-width: 1100px; margin: 0 auto; }
        
        /* 🫧 태블릿 인터랙션 애니메이션 */
        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.97) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-tab-switch { animation: scaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* 📱 태블릿 맞춤 Glassmorphic 카드 */
        .glass-card {
            background: rgba(255, 255, 255, 0.62); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid rgba(255, 255, 255, 0.85); 
            border-radius: 28px; padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
        }

        /* 📱 하단 불투명 플로팅 바 (Dock Bar) */
        .floating-bottom-bar {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 64px); max-width: 520px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 40px; padding: 8px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.1);
            display: flex; gap: 8px; z-index: 9999;
        }

        .nav-dock-btn {
            flex: 1; padding: 14px 24px; border-radius: 32px;
            font-family: 'Paperlogy', sans-serif; font-size: 1.05rem; font-weight: 700;
            color: #666; border: none; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-dock-btn.active {
            background: #6c5ce7; color: #ffffff;
            box-shadow: 0 10px 24px rgba(108, 92, 231, 0.35);
            transform: translateY(-2px);
        }

        /* 태블릿 그리드 분할 */
        .tablet-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; align-items: stretch; }
        @media (max-width: 820px) { .tablet-grid { grid-template-columns: 1fr; } }

        /* 📌 탑 10 고정 박스 및 내부 커스텀 스크롤 */
        .fixed-rank-card {
            height: 520px;
            display: flex;
            flex-direction: column;
        }

        .rank-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        /* 스크롤바 커스텀 */
        .rank-scroll-area::-webkit-scrollbar { width: 6px; }
        .rank-scroll-area::-webkit-scrollbar-thumb { background: rgba(108, 92, 231, 0.25); border-radius: 10px; }
        .rank-scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(108, 92, 231, 0.5); }
        .rank-scroll-area::-webkit-scrollbar-track { background: transparent; }

        /* 랭킹 아이템 */
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: rgba(255, 255, 255, 0.7); border-radius: 18px;
            font-size: 1rem; border: 1px solid rgba(255, 255, 255, 0.9);
            transition: transform 0.2s ease;
        }
        .rank-item:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.9); }
        .rank-item.my-rank {
            background: rgba(108, 92, 231, 0.12); border: 2px solid #6c5ce7; font-weight: 700;
        }
        .rank-badge {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.9rem; font-weight: 800; color: #fff; background: #a1a1a6; flex-shrink: 0;
        }
        .rank-1 { background: #ffd700; color: #1d1d1f; box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4); }
        .rank-2 { background: #c0c0c0; color: #1d1d1f; }
        .rank-3 { background: #cd7f32; color: #fff; }

        /* 넓고 시원한 태블릿 달력 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .calendar-day-head { font-size: 0.85rem; font-weight: 700; color: #86868b; padding: 4px 0; }
        .calendar-day {
            padding: 10px 0; font-size: 0.95rem; border-radius: 14px; background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7); transition: all 0.2s ease;
        }
        .calendar-day.attended {
            background: #6c5ce7; color: #ffffff; font-weight: 800;
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.35); border-color: #6c5ce7;
        }

        /* 로또 공 디자인 */
        .lotto-ball {
            width: 38px; height: 38px; border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center; font-weight: 800; color: #fff;
            font-size: 0.95rem; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.08); flex-shrink: 0;
        }
        .ball-yellow { background: #fbc531; color: #1d1d1f; }
        .ball-blue { background: #00a8ff; }
        .ball-red { background: #e84118; }
        .ball-gray { background: #718093; }
        .ball-green { background: #4cd137; }

        /* 입력 번호 공 */
        .lotto-ball-input {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(210, 210, 225, 0.85);
            text-align: center; font-weight: 800; font-size: 1.15rem; color: #222;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            -moz-appearance: textfield;
        }
        .lotto-ball-input::-webkit-outer-spin-button,
        .lotto-ball-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .lotto-ball-input:focus {
            outline: none; border-color: #6c5ce7; background: #ffffff;
            transform: scale(1.1); box-shadow: 0 0 18px rgba(108, 92, 231, 0.4);
        }
        .lotto-ball-input.bonus-style { border-color: #a29bfe; background: rgba(240, 236, 255, 0.95); }

        .btn-base {
            font-family: 'Paperlogy', sans-serif; font-size: 1rem; font-weight: 700;
            padding: 14px 22px; border-radius: 18px; transition: all 0.25s ease;
            cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background-color: #6c5ce7; color: #ffffff; box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3); }
        .btn-primary:hover { background-color: #5b4bc4; transform: translateY(-2px); }

        .toast-container {
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(29, 29, 31, 0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            color: #ffffff; padding: 14px 28px; border-radius: 30px; font-family: 'Paperlogy', sans-serif;
            font-size: 0.95rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 100000;
            opacity: 0; visibility: hidden; transition: all 0.35s ease; pointer-events: none;
        }
        .toast-container.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toastNotification" class="toast-container"><span id="toastMessage"></span></div>

    <div class="container">
        <!-- 1. [이달의 출석] 태블릿 대시보드 뷰 -->
        <div id="view-attendance" class="tablet-grid animate-tab-switch">
            <!-- 좌측: 출석 달력 및 통계 -->
            <div class="glass-card flex flex-col justify-between space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <span class="emoji-font">📊</span> 나의 이번 달 출석현황
                        </h2>
                        <span id="currentMonthTitle" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">2026년 8월</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white/80 p-5 rounded-2xl border border-white text-center shadow-sm">
                            <div class="text-xs text-gray-400 font-bold mb-1">총 출석일</div>

                    <div class="calendar-grid">

                        <div class="calendar-day-head">수</div>
                        <div class="calendar-day-head">목</div>
                        <div class="calendar-day-head">금</div>
                        <div class="calendar-day-head text-blue-500">토</div>
                    </div>
                    <div id="calendarDays" class="calendar-grid mt-2"></div>
                </div>
            </div>

            <!-- 우측: 고정된 출석 랭킹 순위표 (Top 10 스크롤 적용) -->
            <div class="glass-card fixed-rank-card">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="emoji-font">🥇</span> 이달의 출석 횟수 Top 10
                </h2>
                <div class="rank-scroll-area">
                    <div id="attendanceRankList" class="space-y-2.5">
                        <div class="text-center py-10 text-gray-400">랭킹 불러오는 중...</div>
                    </div>
                </div>
                <div id="myAttendanceRankCard" class="mt-3 pt-3 border-t border-gray-200/60"></div>
            </div>
        </div>

        <!-- 2. [이주의 로또] 태블릿 대시보드 뷰 -->
        <div id="view-lotto" class="tablet-grid animate-tab-switch" style="display: none;">
            <!-- 좌측: 당첨 번호 & 예측 번호 입력 -->
            <div class="glass-card flex flex-col justify-between space-y-6">
                <div>

                            <span class="emoji-font">🎉</span> 지난 주 당첨 번호

                        <div id="lottoWinningBox" class="min-h-[72px] flex items-center justify-center gap-2 bg-white/70 p-4 rounded-2xl border border-white shadow-sm">

                    <!-- 예측 번호 폼 -->
                    <div class="pt-4 border-t border-gray-200/60">
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-lg font-bold flex items-center gap-2">
                                <span class="emoji-font">🔮</span> 이번 주 나의 예측

                            <button onclick="generateAutoLotto()" class="text-xs text-indigo-600 font-bold hover:underline bg-indigo-50 px-3 py-1.5 rounded-full">

                        <div id="myLottoStatus">

                                <div class="flex justify-center gap-2.5 w-full">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">
                                    <input type="number" min="1" max="45" class="lotto-in lotto-ball-input">

                                <div class="flex items-center gap-3 pt-3 border-t border-dashed border-gray-300 w-full justify-center">
                                    <span class="text-sm font-bold text-indigo-600">+ 보너스</span>
                                    <input type="number" id="lottoBonusInput" min="1" max="45" class="lotto-ball-input bonus-style">

                    </div>
                </div>
            </div>

            <!-- 우측: 고정된 로또 예측 랭킹 (Top 10 스크롤 적용) -->
            <div class="glass-card fixed-rank-card">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="emoji-font">🎯</span> 로또 적중 랭킹 Top 10
                </h2>
                <div class="rank-scroll-area">
                    <div id="lottoRankList" class="space-y-2.5">

        </div>
    </div>

    <!-- 📱 하단 불투명 플로팅 바 (Glassmorphic Tablet Dock) -->
    <div class="floating-bottom-bar">
        <button id="nav-btn-attendance" class="nav-dock-btn active" onclick="switchNav('attendance')">
            <span class="emoji-font">📅</span> 이달의 출석
        </button>
        <button id="nav-btn-lotto" class="nav-dock-btn" onclick="switchNav('lotto')">
            <span class="emoji-font">🎰</span> 이주의 로또
        </button>
    </div>

    <script>
    const SECRET_KEY = "u2mkst!";
    const firebaseConfig = {
        apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
        authDomain: "ksthome-76889.firebaseapp.com",
        databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
        projectId: "ksthome-76889",
        storageBucket: "ksthome-76889.firebasestorage.app",
        messagingSenderId: "411945142173",
        appId: "1:411945142173:web:c6fdb499040b2a5a4f9174"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let currentUserUid = null;
    let currentStudentName = "학생";

    function decryptAES(cipherText) {
        if (!cipherText) return "";
        try {
            const clean = cipherText.toString().trim();
            if (!clean.startsWith("U2FsdGVkX1")) return clean;
            const bytes = CryptoJS.AES.decrypt(clean, SECRET_KEY);
            return bytes.toString(CryptoJS.enc.Utf8) || clean;
        } catch (e) { return cipherText; }
    }

    function showToast(msg) {
        const t = document.getElementById('toastNotification');
        document.getElementById('toastMessage').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* 하단 불투명 플로팅 바 탭 전환 */
    function switchNav(tab) {
        document.getElementById('nav-btn-attendance').classList.toggle('active', tab === 'attendance');
        document.getElementById('nav-btn-lotto').classList.toggle('active', tab === 'lotto');
        
        const attView = document.getElementById('view-attendance');
        const lottoView = document.getElementById('view-lotto');

        if(tab === 'attendance') {
            lottoView.style.display = 'none';
            attView.style.display = 'grid';
            attView.classList.remove('animate-tab-switch');
            void attView.offsetWidth; // Trigger Reflow
            attView.classList.add('animate-tab-switch');
        } else {
            attView.style.display = 'none';
            lottoView.style.display = 'grid';
            lottoView.classList.remove('animate-tab-switch');
            void lottoView.offsetWidth; // Trigger Reflow
            lottoView.classList.add('animate-tab-switch');
        }
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUserUid = user.uid;
            database.ref(`students/${user.uid}`).once('value', snap => {
                const data = snap.val();
                if(data) {
                    const rawName = data.name || data.studentName || data.userName;
                    currentStudentName = rawName ? decryptAES(rawName) : "학생";
                }
                loadAttendanceData();
                loadLottoData();
            });
        } else {
            window.location.replace('login.html');
        }
    });

    /* --- [1. 출석 로직] --- */
    function loadAttendanceData() {
        const now = new Date();
        const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('currentMonthTitle').innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;

        database.ref('attendance').once('value', (snapshot) => {
            const allData = snapshot.val() || {};
            let rankArray = [];

            database.ref('students').once('value', (stdSnap) => {
                const stds = stdSnap.val() || {};

                Object.keys(allData).forEach(uid => {
                    const monthInfo = allData[uid][yearMonth];
                    if (monthInfo) {
                        const count = monthInfo.count || 0;
                        const std = stds[uid] || {};
                        
                        const rawName = std.name || std.studentName || std.userName;
                        const name = rawName ? decryptAES(rawName) : "학생";
                        const school = std.schoolName || "학교 미기재";
                        const teacher = std.teacher ? `${std.teacher} 선생님` : "선생님 미기재";

                        rankArray.push({ uid: uid, name: name, school: school, teacher: teacher, count: count });
                    }
                });

                rankArray.sort((a, b) => b.count - a.count);
                renderAttendanceRank(rankArray);
                renderMyCalendar(allData[currentUserUid] ? allData[currentUserUid][yearMonth] : null, now);
            });
        });
    }

    function renderAttendanceRank(rankArray) {
        const container = document.getElementById('attendanceRankList');
        const myRankContainer = document.getElementById('myAttendanceRankCard');
        container.innerHTML = '';

        if (rankArray.length === 0) {
            container.innerHTML = '<div class="text-center py-10 text-gray-400">이번 달 출석 기록이 없습니다.</div>';
            return;
        }

        let myRankInfo = null;
        let myRankIndex = -1;

        rankArray.forEach((item, idx) => {
            if (item.uid === currentUserUid) {
                myRankInfo = item;
                myRankIndex = idx + 1;
            }

            if (idx < 10) {
                const isMe = item.uid === currentUserUid;
                const badgeClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
                
                const html = `
                    <div class="rank-item ${isMe ? 'my-rank' : ''}">
                        <div class="flex items-center gap-3">
                            <div class="rank-badge ${badgeClass}">${idx + 1}</div>
                            <div>
                                <div class="font-bold">${item.name} ${isMe ? '(나)' : ''}</div>
                                <div class="text-xs text-gray-500">🏫 ${item.school} | 👨‍🏫 ${item.teacher}</div>
                            </div>
                        </div>
                        <span class="font-black text-indigo-600">${item.count}일</span>
                    </div>`;
                container.innerHTML += html;
            }
        });

        if (myRankInfo) {
            myRankContainer.innerHTML = `
                <div class="rank-item my-rank">
                    <div class="flex items-center gap-3">
                        <span class="text-xs bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-md">내 순위</span>
                        <div>
                            <div class="font-bold">${myRankIndex}위 (${myRankInfo.name})</div>
                            <div class="text-xs text-gray-500">🏫 ${myRankInfo.school} | 👨‍🏫 ${myRankInfo.teacher}</div>
                        </div>
                    </div>
                    <span class="font-black text-indigo-600">${myRankInfo.count}일</span>
                </div>`;
        }
    }

    function renderMyCalendar(myMonthData, now) {
        const daysContainer = document.getElementById('calendarDays');
        daysContainer.innerHTML = '';

        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = new Date(year, month, 1).getDay();

        const attendedDays = myMonthData && myMonthData.days ? myMonthData.days : {};
        const attCount = Object.keys(attendedDays).length;

        document.getElementById('myAttDays').innerText = `${attCount}일`;
        const rate = Math.round((attCount / daysInMonth) * 100);
        document.getElementById('myAttRate').innerText = `${rate}%`;

        for (let i = 0; i < firstDayIndex; i++) {
            daysContainer.innerHTML += `<div></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isAttended = !!attendedDays[dateStr];
            daysContainer.innerHTML += `<div class="calendar-day ${isAttended ? 'attended' : ''}">${d}</div>`;
        }
    }

    /* --- [2. 로또 로직] --- */
    function loadLottoData() {
        fetch("https://lotto-vzqu.onrender.com/")
            .then(res => res.json())
            .then(resData => {
                if (resData && resData.status === "success" && resData.data) {
                    renderLottoWinningBalls(resData.data.numbers, resData.data.bonusNo);
                }
            })
            .catch(err => {
                document.getElementById('lottoWinningBox').innerHTML = `<span class="text-xs text-red-500 font-bold">당첨 번호를 불러올 수 없습니다.</span>`;
            });

        database.ref('lotto_predictions').once('value', (snapshot) => {
            const predictions = snapshot.val() || {};
            renderLottoRank(predictions);
            checkMyLottoSubmission(predictions[currentUserUid]);
        });
    }

    function getBallColorClass(num) {
        if (num <= 10) return 'ball-yellow';
        if (num <= 20) return 'ball-blue';
        if (num <= 30) return 'ball-red';
        if (num <= 40) return 'ball-gray';
        return 'ball-green';
    }

    function renderLottoWinningBalls(numbers, bonus) {
        const box = document.getElementById('lottoWinningBox');
        box.innerHTML = '';
        numbers.forEach(n => {
            box.innerHTML += `<div class="lotto-ball ${getBallColorClass(n)}">${n}</div>`;
        });
        box.innerHTML += `<span class="font-bold text-gray-400 mx-1.5">+</span>`;
        box.innerHTML += `<div class="lotto-ball ${getBallColorClass(bonus)}">${bonus}</div>`;
    }

    function renderLottoRank(predictions) {
        const container = document.getElementById('lottoRankList');
        container.innerHTML = '';

        let rankArray = [];
        database.ref('students').once('value', (stdSnap) => {
            const stds = stdSnap.val() || {};
            
            Object.keys(predictions).forEach(uid => {
                const item = predictions[uid];
                const std = stds[uid] || {};

                const rawName = std.name || std.studentName || std.userName;
                const name = rawName ? decryptAES(rawName) : "학생";

                rankArray.push({
                    uid: uid,
                    name: name,
                    school: std.schoolName || "학교 미기재",
                    teacher: std.teacher ? `${std.teacher} 선생님` : "선생님 미기재",
                    matchedCount: item.matchedCount || 0
                });
            });

            rankArray.sort((a, b) => b.matchedCount - a.matchedCount);

            if (rankArray.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400">이번 주 예측 참여자가 없습니다.</div>';
                return;
            }

            rankArray.slice(0, 10).forEach((item, idx) => {
                const isMe = item.uid === currentUserUid;
                const badgeClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
                container.innerHTML += `
                    <div class="rank-item ${isMe ? 'my-rank' : ''}">
                        <div class="flex items-center gap-3">
                            <div class="rank-badge ${badgeClass}">${idx + 1}</div>
                            <div>
                                <div class="font-bold">${item.name} ${isMe ? '(나)' : ''}</div>
                                <div class="text-xs text-gray-500">🏫 ${item.school} | 👨‍🏫 ${item.teacher}</div>
                            </div>
                        </div>
                        <span class="font-black text-indigo-600">${item.matchedCount}개 적중</span>
                    </div>`;
            });
        });
    }

    function checkMyLottoSubmission(myPrediction) {
        const statusBox = document.getElementById('myLottoStatus');
        if (myPrediction) {
            const balls = myPrediction.numbers.map(n => `<div class="lotto-ball ${getBallColorClass(n)}">${n}</div>`).join(' ');
            const bonusBall = myPrediction.bonus ? `<div class="lotto-ball ${getBallColorClass(myPrediction.bonus)}">${myPrediction.bonus}</div>` : '';
            
            statusBox.innerHTML = `
                <div class="bg-indigo-50/80 p-5 rounded-2xl border border-indigo-100 text-center shadow-sm">
                    <div class="text-sm text-indigo-600 font-extrabold mb-3">✅ 이번 주 예측 제출 완료</div>
                    <div class="flex justify-center items-center gap-2 mt-2 flex-wrap">
                        ${balls}
                        ${bonusBall ? `<span class="font-bold text-gray-400 mx-1">+</span> ${bonusBall}` : ''}
                    </div>
                </div>`;
        }
    }

    function generateAutoLotto() {
        let nums = new Set();
        while(nums.size < 7) {
            nums.add(Math.floor(Math.random() * 45) + 1);
        }
        const arr = Array.from(nums);
        const bonus = arr.pop();
        const sorted = arr.sort((a,b) => a-b);

        const inputs = document.querySelectorAll('.lotto-in');
        inputs.forEach((input, idx) => input.value = sorted[idx]);
        document.getElementById('lottoBonusInput').value = bonus;
    }

    function submitLottoPrediction() {
        const inputs = document.querySelectorAll('.lotto-in');
        const bonusInput = document.getElementById('lottoBonusInput');
        
        let selected = [];
        for (let input of inputs) {
            const val = parseInt(input.value);
            if (isNaN(val) || val < 1 || val > 45) {
                showToast("1~45 사이의 숫자를 올바르게 입력해주세요.");
                return;
            }
            selected.push(val);
        }

        const bonusVal = parseInt(bonusInput.value);
        if (isNaN(bonusVal) || bonusVal < 1 || bonusVal > 45) {
            showToast("보너스 번호(1~45)를 입력해주세요.");
            return;
        }

        const totalSet = new Set([...selected, bonusVal]);
        if (totalSet.size !== 7) {
            showToast("중복된 번호가 있습니다. 7개 번호를 모두 다르게 입력해주세요.");
            return;
        }

        selected.sort((a,b) => a-b);

        database.ref(`lotto_predictions/${currentUserUid}`).set({
            studentName: currentStudentName,
            numbers: selected,
            bonus: bonusVal,
            matchedCount: 0,
            submittedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            showToast("🎉 로또 예측 번호 제출 완료!");
            loadLottoData();
        }).catch(err => showToast("제출 실패: " + err.message));
    }
    </script>
</body>
</html>
