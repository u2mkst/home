name: Deploy with Secrets Injection

on:
  push:
    branches:
      - main  # main 브랜치에 코드가 올라올 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 모든 .html 파일 내의 4개 치환 문구를 GitHub Secrets 값으로 변경
      - name: Inject Secrets into Code
        run: |
          find . -type f -name "*.html" -exec sed -i 's/ENV_NEIS_API_KEY/${{ secrets.NEIS_API_KEY }}/g' {} +
          find . -type f -name "*.html" -exec sed -i 's/ENV_SECRET_SALT/${{ secrets.SECRET_SALT }}/g' {} +
          find . -type f -name "*.html" -exec sed -i 's/ENV_NAVER_CLIENT_ID/${{ secrets.NAVER_CLIENT_ID }}/g' {} +
          find . -type f -name "*.html" -exec sed -i 's/ENV_NAVER_CLIENT_SECRET/${{ secrets.NAVER_CLIENT_SECRET }}/g' {} +

      # 치환이 끝난 파일들을 gh-pages 브랜치에 자동 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
