<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P 수학입시학원 로그인</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        /* 프리미엄 웹폰트 설정 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; font-display: swap;
        }

        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4cc4;
            --primary-glow: rgba(108, 92, 231, 0.12);
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --input-bg: rgba(255, 255, 255, 0.8);
            --radius-lg: 20px; /* 라운딩 반경을 살짝 줄여 더 날렵하게 변경 */
            --radius-md: 12px;
        }

        body { 
            font-family: 'Paperlogy', 'Noto Sans KR', sans-serif; 
            background: var(--bg-gradient);
            background-blend-mode: multiply;
            margin: 0; padding: 0; color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box;
        }

        /* [태블릿 대응 - 콤팩트 가변 컨테이너] */
        .container {
            width: 100%;
            max-width: 390px; /* 로그인 시 기본 콤팩트 가로폭 */
            padding: 24px 16px;
            box-sizing: border-box;
            transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* 회원가입 시 부담스럽지 않게만 확장되는 가로폭 */
        body.mode-register .container {
            max-width: 620px; 
        }

        /* [날렵해진 로고 헤더] */
        .header-zone { 
            text-align: center; 
            margin-bottom: 16px; 
            background: rgba(255, 255, 255, 0.6);
            padding: 16px 20px; /* 패딩 축소 */
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .header-zone:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.75);
        }

        .header-zone .logo-wrapper {
            width: 100%;
            max-width: 200px; /* 로고 가로 최대폭 축소 */
            height: 38px; /* 로고 높이 슬림화 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .header-zone .logo-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            object-position: center 48%;
        }

        /* [아크릴릭 카드 바디 여백 최적화] */
        .auth-card { 
            background: rgba(255, 255, 255, 0.45); 
            padding: 28px 22px; /* 전체 패딩 다운사이징 */
            border-radius: var(--radius-lg); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardFadeIn 0.4s ease;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            margin-top: 0; 
            color: var(--text-main); 
            font-size: 1.2rem; /* 폰트 축소 */
            font-weight: 700; 
            margin-bottom: 22px; 
            text-align: center; 
            letter-spacing: -0.5px;
        }
        
        /* [입력 세트 구성] */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px; /* 간격 축소 */
        }

        label { 
            display: block; 
            font-weight: 600; 
            font-size: 0.82rem; /* 폰트 크기 다운 */
            color: #4a5568; 
            margin-bottom: 6px; 
            padding-left: 2px; 
        }

        /* [슬림하고 단단해진 입력 필드] */
        input, select { 
            width: 100%; 
            padding: 12px 14px; /* 패딩 대폭 축소 */
            border: 1px solid rgba(0, 0, 0, 0.08); 
            border-radius: var(--radius-md); 
            box-sizing: border-box; 
            font-size: 0.9rem; /* 폰트 크기 다운 */
            font-family: inherit;
            background-color: var(--input-bg); 
            color: var(--text-main); 
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.01);
        }
        
        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            background-color: #ffffff; 
            box-shadow: 0 0 0 3px var(--primary-glow); 
        }

        /* [정교하게 밀착된 2열 그리드] */
        .form-grid {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px 16px; /* 좌우 여백 정밀화 */
            }
            .full-width {
                grid-column: span 2;
            }
            .auth-card {
                padding: 32px 28px; /* 가입화면 내부 여백 최적화 */
            }
        }

        /* [자동완성 목록 슬림형 튜닝] */
        .autocomplete-wrapper { position: relative; width: 100%; }
        .autocomplete-list {
            position: absolute; top: calc(100% + 2px); left: 0; right: 0;
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-md); max-height: 150px; overflow-y: auto;
            border: 1px solid rgba(108, 92, 231, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .autocomplete-item {
            padding: 11px 14px; cursor: pointer; font-size: 0.88rem;
            color: var(--text-main); border-bottom: 1px solid rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center;
        }
        .autocomplete-item:hover { background: rgba(108, 92, 231, 0.05); color: var(--primary); }
        .autocomplete-item .school-region { font-size: 0.74rem; color: var(--text-muted); }

        /* 가이드 안내 텍스트 컴팩트화 */
        .info-text { font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; padding-left: 2px; line-height: 1.3; }
        .warning-text { font-size: 0.74rem; color: #e53e3e; margin-top: 4px; padding-left: 2px; font-weight: 600; line-height: 1.3; }
        
        /* 컴팩트해진 대쉬 라인 구분선 */
        .section-divider {
            border-top: 1px dashed rgba(108, 92, 231, 0.2);
            margin: 20px 0 16px 0;
            position: relative;
        }
        .section-title {
            font-size: 0.74rem; color: var(--primary); font-weight: 700;
            background: #edf1f5; padding: 2px 10px; border-radius: 20px;
            position: absolute; top: -10px; left: 8px;
        }

        /* 동의 사항 슬림 라인 */
        .agree-container {
            display: flex;
            align-items: center;
            margin: 4px 0 10px 0;
            padding-left: 2px;
            cursor: pointer;
        }
        .agree-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            margin-bottom: 0;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .agree-text {
            font-size: 0.82rem;
            color: #4a5568;
            font-weight: 600;
        }
        
        /* 요약 약관 박스 축소 */
        .policy-text-box {
            width: 100%;
            height: 70px; /* 높이 축소 */
            padding: 10px 12px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.6);
            font-size: 0.74rem;
            line-height: 1.4;
            color: #555;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
            outline: none;
        }

        /* [쫀득한 피드백 물리 액션 버튼] */
        button { 
            display: block; 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); 
            color: #ffffff; border: none;
            padding: 13px 18px; border-radius: var(--radius-md); /* 버튼 두께 슬림화 */
            cursor: pointer; font-weight: 600; font-size: 0.94rem;
            width: 100%; font-family: inherit; 
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); 
            margin-top: 6px;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 18px rgba(108, 92, 231, 0.3); 
        }
        button:active { 
            transform: translateY(0) scale(0.98); 
            box-shadow: 0 3px 8px rgba(108, 92, 231, 0.15); 
        }

        .switch-mode { text-align: center; margin-top: 18px; font-size: 0.82rem; color: #718096; }
        .switch-link { color: var(--primary); text-decoration: none; font-weight: 600; margin-left: 4px; cursor: pointer; }
        .switch-link:hover { text-decoration: underline; }

        .hidden { display: none !important; }

        /* [모달창 슬림형 설계] */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.35); 
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            width: 350px; /* 대화상자 너비 컴팩트화 */
            max-width: 90%;
            background: #FFFFFF; border-radius: var(--radius-lg);
            padding: 28px 24px; box-sizing: border-box; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            transform: translateY(20px) scale(0.96); 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.12);
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        .modal-title { font-size: 1.2rem; font-weight: bold; color: #0F172A; margin: 0 0 8px 0; }
        .modal-desc { font-size: 0.84rem; color: #64748B; margin: 0 0 20px 0; line-height: 1.5; }
        
        .btn-download { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); margin-bottom: 10px; }
        .btn-download:hover { background: #1D4ED8; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); }
        
        .btn-close-modal { background: #F1F5F9; color: #475569; box-shadow: none; margin-top: 0; }
        .btn-close-modal:hover { background: #E2E8F0; }
    </style>
</head>
<body class="mode-login">

    <div class="container">
        <!-- 상단 헤더 슬림 브랜드 존 -->
        <div class="header-zone" id="logoZone">
            <div class="logo-wrapper">
                <img src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20250713_196%2F1752417299448f8dDm_PNG%2FKP%25BC%25F6%25C7%25D0%25C0%25D4%25BD%25C3%25C7%25D0%25BF%25F8_%25B7%25CE%25B0%25ED-%25B0%25A1%25B7%25CE1.png" alt="K&P 수학입시학원 로고" class="logo-img">
            </div>
        </div>

        <!-- 로그인 폼 (고밀도 슬림 레이아웃) -->
        <div id="loginCard" class="auth-card">
            <h2>학생 로그인</h2>
            <form onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label>유투엠 아이디</label>
                    <input type="text" id="loginId" placeholder="ufes로 시작하는 아이디 입력" required>
                </div>
                
                <div class="form-group">
                    <label>부모님 전화번호 뒷자리</label>
                    <input type="password" id="loginPassword" placeholder="숫자 4자리 입력" maxlength="4" inputmode="numeric" required>
                </div>
                
                <button type="submit">로그인하고 입장하기</button>
            </form>
            <div class="switch-mode">
                처음 왔나요? <span class="switch-link" onclick="toggleMode('register')">회원가입 하기</span>
            </div>
        </div>

        <!-- 회원가입 폼 (정밀 2열 고밀도 레이아웃) -->
        <div id="registerCard" class="auth-card hidden">
            <h2>학생 회원가입</h2>
            <form onsubmit="handleStudentRegister(event)">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label>학생 이름</label>
                        <input type="text" id="registerName" placeholder="실명을 입력하세요 (예: 홍길동)" required>
                    </div>

                    <div class="form-group">
                        <label>유투엠 아이디</label>
                        <input type="text" id="registerId" placeholder="예: ufes123456" required>
                        <div class="warning-text">※ 반드시 ufes로 시작하는 아이디를 정확히 입력하세요.</div>
                    </div>

                    <div class="form-group">
                        <label>부모님 전화번호 뒷자리 (4자리)</label>
                        <input type="text" id="registerParentPhone" placeholder="예: 5678" maxlength="4" inputmode="numeric" required>
                        <div class="info-text">※ 이 번호가 앞으로 로그인할 때 비밀번호가 됩니다.</div>
                    </div>
                    
                    <div class="form-group">
                        <label>소속 학교</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="registerSchool" placeholder="예: 대치중" autocomplete="off" required>
                            <div id="schoolList" class="autocomplete-list hidden"></div>
                        </div>
                        <input type="hidden" id="registerSchoolCode"> 
                    </div>

                    <div class="form-group full-width">
                        <label>담당 선생님 선택</label>
                        <select id="registerTeacher" required>
                            <option value="" disabled selected>담당 선생님을 선택해 주세요</option>
                            <option value="김동진">김동진 선생님</option>
                            <option value="이주희">이주희 선생님</option>
                            <option value="차현준">차현준 선생님</option>
                            <option value="권준수">권준수 선생님</option>
                            <option value="박다희">박다희 선생님</option>
                            <option value="정찬호">정찬호 선생님</option>
                            <option value="김영호">김영호 선생님</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <div class="section-divider">
                            <span class="section-title">매쓰플랫 연동 정보</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>매쓰플랫 아이디 (학생 휴대폰)</label>
                        <input type="text" id="registerMathflatPhone" placeholder="하이픈(-) 없이 숫자만" inputmode="numeric" required>
                    </div>
                    
                    <div class="form-group">
                        <label>매쓰플랫 비밀번호</label>
                        <input type="password" id="registerMathflatPw" placeholder="접속 비밀번호 입력" required>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>이용약관 및 개인정보처리방침</label>
                        <textarea class="policy-text-box" readonly>[데이터 처리 방침 요약] 본 서비스는 회원가입 시 수집하는 모든 개인 식별 정보(이름, 연락처, 연동 패스워드 등)를 군사 통신 표준 규격인 AES-256 알고리즘으로 강력하게 암호화하여 저장하며, 암호화된 데이터는 승인된 관리 시스템 외에는 복호화가 불가능합니다.
                          
[K&P 수학입시학원 서비스 이용약관 및 개인정보처리방침]

본 약관은 K&P 수학입시학원(이하 '학원')이 제공하는 학생 학습 관리 및 연동 시스템(이하 '서비스')의 이용 조건, 절차 및 회원 개인정보 보호에 관한 사항을 규정합니다.


제 1 장 이용약관


제 1 조 (목적)
본 약관은 회원이 학원에서 제공하는 서비스를 이용함에 있어, 학원과 회원 간의 권리, 의무 및 책임 사항을 규정함을 목적으로 합니다.

제 2 조 (이용계약의 성립)
1. 이용계약은 회원이 본 약관 및 개인정보 수집·이용 동의서에 동의한 후, 학원이 정한 가입 양식에 따라 필수 정보를 입력하여 가입을 신청하고 학원이 이를 승인함으로써 성립합니다.
2. 회원은 반드시 실명 및 본인의 정확한 정보(U2M ID 등)를 제공해야 하며, 허위 정보를 입력한 경우 서비스 이용이 제한되거나 계정이 삭제될 수 있습니다.

제 3 조 (서비스의 제공 및 제한)
1. 본 서비스는 학원 수강생의 학습 상태 확인, 키오스크 프로그램 이용 및 외부 학습 솔루션(매쓰플랫)과의 데이터 연동 서비스를 제공합니다.
2. 학원은 시스템 점검, 통신 장애 등 기술적 필요가 있는 경우 사전 고지 후 서비스의 일부 또는 전부를 일시적으로 중단할 수 있습니다.


제 2 장 개인정보처리방침
                          

학원은 회원의 개인정보를 매우 중요하게 여겨지며, 개인정보보호법 등 관련 법령에 따라 회원의 개인정보를 안전하게 보호하고 처리하기 위해 다음과 같은 조치를 취하고 있습니다.

1. 수집하는 개인정보 항목
학원은 가입 화면을 통해 아래의 7가지 항목에 한하여 최소한의 개인정보를 수집합니다.
- 학생 이름, 유투엠(U2M) 아이디, 부모님 전화번호 뒷자리(4자리), 소속 학교명 및 학교 코드, 담당 선생님 선택 정보, 매쓰플랫 아이디(학생 휴대폰 번호), 매쓰플랫 비밀번호

2. 개인정보의 수집 및 이용 목적
수집된 개인정보는 다음의 목적 이외의 용도로는 사용되지 않습니다.
- 학생 본인 식별 확인 및 학적 관리

3. 개인정보의 강력한 암호화 및 기술적 보호 조치
학원은 회원의 소중한 개인정보를 보호하기 위해 업계 최고 수준의 보안 조치를 적용합니다.
- 학생 이름, 부모님 전화번호 뒷자리, 매쓰플랫 아이디(학생 휴대폰 번호), 매쓰플랫 비밀번호 등 식별 및 연동 정보는 데이터베이스 저장 즉시 AES-256 알고리즘으로 강력하게 암호화 처리합니다.
- 암호화된 데이터는 고유 솔트(Salt) 값을 활용하여 유출 시에도 원본 복호화가 원천적으로 불가능하도록 설계되어 있습니다.

4. 개인정보의 보유 및 이용 기간
- 회원의 개인정보는 서비스 이용 기간(학원 재원 기간) 동안에 한하여 안전하게 보유 및 이용됩니다.
- 학생이 학원을 퇴원하거나 서비스 탈퇴를 요청하는 경우, 수집된 모든 개인정보 및 암호화 데이터는 복구 불가능한 방법으로 즉시 영구 파기됩니다.

5. 개인정보의 제3자 제공 및 위탁에 관한 사항
학원은 회원의 개인정보를 외부에 무단 제공하거나 위탁하지 않으며, 가입 시 입력한 매쓰플랫 계정 정보는 오직 매쓰플랫 연동 목적의 개별 로그인 처리에만 안전하게 사용됩니다.

본 약관 및 개인정보처리방침은 공시된 날로부터 즉시 적용됩니다.</textarea>

                    <div class="form-group full-width">
                        <label class="agree-container">
                            <input type="checkbox" id="registerAgreement">
                            <span class="agree-text">위 이용약관 및 개인정보 보관에 동의합니다. (필수)</span>
                        </label>
                    </div>
                    
                </div>
                
                <button type="submit" style="margin-top: 10px;">가입 완료하기</button>
            </form>
            <div class="switch-mode">
                이미 계정이 있나요? <span class="switch-link" onclick="toggleMode('login')">로그인하러 가기</span>
            </div>
        </div>
    </div>

    <!-- 간결해진 모달 시스템 -->
    <div id="downloadModal" class="modal-overlay">
        <div class="modal-box">
            <p class="modal-title">💾 KIOSK SYSTEM APK</p>
            <p class="modal-desc">최신 빌드 버전의 키오스크 설치 파일(.apk)을 단말기에 직접 다운로드합니다.</p>
            <button class="btn-download" onclick="startApkDownload()">설치 파일 다운로드</button>
            <button class="btn-close-modal" onclick="closeDownloadModal()">창 닫기</button>
        </div>
    </div>

    <script>
        // 파이어베이스 및 암호화 필수 변수 보존 (100% 동일)
        const firebaseConfig = {
            apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
            authDomain: "ksthome-76889.firebaseapp.com",
            databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
            projectId: "ksthome-76889",
            storageBucket: "ksthome-76889.firebasestorage.app",
            messagingSenderId: "411945142173",
            appId: "1:411945142173:web:c6fdb499040b2a5a4f9174",
            measurementId: "G-72TJ0364MJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const SECRET_SALT = "u2mkst!";
        const NEIS_API_KEY = "19f78fd07bfb4243a6333e7bf4641bfc";

        const schoolInput = document.getElementById('registerSchool');
        const schoolList = document.getElementById('schoolList');
        const schoolCodeInput = document.getElementById('registerSchoolCode');

        let logoClickCount = 0;
        let logoClickTimeout;

        document.getElementById('logoZone').addEventListener('click', function() {
            logoClickCount++;
            
            clearTimeout(logoClickTimeout);
            
            logoClickTimeout = setTimeout(() => {
                logoClickCount = 0;
            }, 1500);

            if (logoClickCount === 5) {
                logoClickCount = 0; 
                document.getElementById('downloadModal').classList.add('active');
            }
        });

        function closeDownloadModal() {
            document.getElementById('downloadModal').classList.remove('active');
        }

        function startApkDownload() {
            window.location.href = "https://u2mkst.github.io/home/kst.apk";
            closeDownloadModal();
        }

        schoolInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
                schoolCodeInput.value = '';
                return;
            }

            const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_API_KEY}&Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    schoolList.innerHTML = '';
                    if (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) {
                        const rows = data.schoolInfo[1].row;
                        schoolList.classList.remove('hidden');
                        rows.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.innerHTML = `${item.SCHUL_NM} <span class="school-region">${item.ATPT_OFCDC_SC_NM}</span>`;
                            div.addEventListener('click', () => {
                                schoolInput.value = item.SCHUL_NM;
                                schoolCodeInput.value = item.SD_SCHUL_CODE;
                                schoolList.innerHTML = '';
                                schoolList.classList.add('hidden');
                            });
                            schoolList.appendChild(div);
                        });
                    } else {
                        schoolList.classList.add('hidden');
                    }
                })
                .catch(err => {
                    console.error("나이스 API 로딩 오류:", err);
                });
        });

        document.addEventListener('click', function(e) {
            if (e.target !== schoolInput && e.target !== schoolList) {
                schoolList.innerHTML = '';
                schoolList.classList.add('hidden');
            }
        });

        function toggleMode(mode) {
            if(mode === 'register') {
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('registerCard').classList.remove('hidden');
                document.body.classList.remove('mode-login');
                document.body.classList.add('mode-register'); 
            } else {
                document.getElementById('registerCard').classList.add('hidden');
                document.getElementById('loginCard').classList.remove('hidden');
                document.body.classList.remove('mode-register');
                document.body.classList.add('mode-login'); 
            }
        }

        function handleStudentRegister(e) {
            e.preventDefault();
            const studentName = document.getElementById('registerName').value.trim();
            const u2mId = document.getElementById('registerId').value.trim().toLowerCase();
            const phoneTail = document.getElementById('registerParentPhone').value.trim();
            const schoolName = schoolInput.value.trim();
            const schoolCode = schoolCodeInput.value.trim();
            const selectedTeacher = document.getElementById('registerTeacher').value;
            
            const mathflatPhone = document.getElementById('registerMathflatPhone').value.trim().replace(/[^0-9]/g, '');
            const mathflatPw = document.getElementById('registerMathflatPw').value.trim();
            const isAgreed = document.getElementById('registerAgreement').checked;

            if (!u2mId.startsWith('ufes') || u2mId.length < 6) {
                alert('⚠️ 올바른 유투엠 아이디 형식이 아닙니다!\n아이디는 반드시 ufes로 시작해야 합니다.');
                return;
            }

            if (!/^\d{4}$/.test(phoneTail)) {
                alert('부모님 전화번호 뒷자리는 숫자 4자리로 입력해주세요.');
                return;
            }

            if (!schoolName || !schoolCode) {
                alert('⚠️ 소속 학교를 입력한 후, 반드시 자동완성 리스트에서 우리 학교를 터치(선택)해 주세요.');
                return;
            }

            if (!selectedTeacher) {
                alert('담당 선생님을 선택해 주세요.');
                return;
            }

            if (mathflatPhone.length < 10) {
                alert('올바른 매쓰플랫 아이디(휴대폰 번호 전체)를 입력해 주세요.');
                return;
            }
            if (!mathflatPw) {
                alert('매쓰플랫 비밀번호를 입력해 주세요.');
                return;
            }

            if (!isAgreed) {
                alert('이용약관 및 개인정보처리방침에 동의하셔야 회원가입이 가능합니다.');
                return;
            }

            const studentEmail = u2mId + "@kst.com"; 
            const studentPassword = "00" + phoneTail; 

            const encryptedName = CryptoJS.AES.encrypt(studentName, SECRET_SALT).toString();
            const encryptedPhoneTail = CryptoJS.AES.encrypt(phoneTail, SECRET_SALT).toString();
            
            const encryptedMfPhone = CryptoJS.AES.encrypt(mathflatPhone, SECRET_SALT).toString();
            const encryptedMfPw = CryptoJS.AES.encrypt(mathflatPw, SECRET_SALT).toString();

            auth.createUserWithEmailAndPassword(studentEmail, studentPassword)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    return user.updateProfile({
                        displayName: studentName 
                    }).then(() => {
                        return database.ref('students/' + user.uid).set({
                            name: encryptedName,                  
                            u2mId: u2mId,                         
                            schoolName: schoolName,               
                            schoolCode: schoolCode,               
                            teacher: selectedTeacher,             
                            phone: encryptedPhoneTail,            
                            studentPhone: encryptedMfPhone,       
                            mathflatPw: encryptedMfPw,           
                            mathflatId: mathflatPhone,            
                            joinedAt: firebase.database.ServerValue.TIMESTAMP
                        });
                    });
                })
                .then(() => {
                    alert('🎉 회원가입이 완료되었습니다!\n유투엠 아이디와 비밀번호로 로그인해 주세요.');
                    document.getElementById('registerAgreement').checked = false;
                    
                    document.getElementById('registerMathflatPhone').value = "";
                    document.getElementById('registerMathflatPw').value = "";
                    
                    toggleMode('login');
                    document.getElementById('loginId').value = u2mId;
                })
                .catch((error) => {
                    if(error.code === "auth/email-already-in-use") {
                        alert("이미 등록된 유투엠 아이디입니다.");
                    } else {
                        alert('회원가입 실패: ' + error.message);
                    }
                });
        }

        function handleStudentLogin(e) {
            e.preventDefault();
            const u2mId = document.getElementById('loginId').value.trim().toLowerCase();
            const phoneTail = document.getElementById('loginPassword').value.trim();

            const studentEmail = u2mId.includes('@') ? u2mId : u2mId + "@kst.com";
            const studentPassword = "00" + phoneTail;

            auth.signInWithEmailAndPassword(studentEmail, studentPassword)
                .then((userCredential) => {
                    const u2mId = studentEmail.split('@')[0];
                    localStorage.setItem('u2m_id', u2mId);
                    localStorage.setItem('u2m_pw', studentPassword);
                    window.location.href = './index.html'; 
                })
                .catch((error) => {
                    alert("로그인에 실패했습니다: " + error.message);
                });
        }
    </script>
