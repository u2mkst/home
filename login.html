<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K&P 수학입시학원 로그인</title>
    
    <!-- Firebase & CryptoJS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <!-- Font Awesome (눈모양 아이콘용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google reCAPTCHA v2 API Script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Mona12 폰트 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">

    <!-- 프리미엄 폰트 시스템 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    
    <style>
        @import url("https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css");
        @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');

        @font-face {
            font-family: 'FlightSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/FlightSans-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        :root {
            --font-emoji: 'Mona12', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', sans-serif;
            --font-title: 'FlightSans', 'Plus Jakarta Sans', var(--font-emoji), -apple-system, sans-serif;
            --font-body: 'Pretendard', var(--font-emoji), -apple-system, sans-serif;

            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.18);
            
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.95);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; }

        html, body {
            overscroll-behavior-y: contain;
        }

        body { 
            font-family: var(--font-body); 
            background: var(--bg-gradient);
            background-blend-mode: multiply;
            margin: 0; padding: 24px 16px; color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .mona12, .emoji-icon {
            font-family: 'Mona12', sans-serif !important;
            font-style: normal;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .header-zone { 
            text-align: center; 
            margin-bottom: 18px; 
            background: rgba(255, 255, 255, 0.72);
            padding: 18px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.03);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .header-zone:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.05);
        }

        .header-zone .logo-wrapper {
            width: 100%; max-width: 190px; height: 38px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .header-zone .logo-img {
            width: 100%; height: 110px;
            object-fit: cover; object-position: center 48%;
        }

        .auth-card { 
            background: rgba(255, 255, 255, 0.78); 
            padding: 36px 28px;
            border-radius: var(--radius-lg); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            animation: cardFadeIn 0.35s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            font-family: var(--font-title);
            margin-top: 0; color: var(--text-main); 
            font-size: 1.45rem; font-weight: 700; 
            margin-bottom: 24px; text-align: center; letter-spacing: -0.3px;
        }

        .step-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; position: relative;
        }

        .step-bar::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: 2px; background: rgba(0, 0, 0, 0.08); z-index: 1;
            transform: translateY(-50%);
        }

        .step-item {
            width: 32px; height: 32px; border-radius: 50%; background: #ffffff;
            border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-family: var(--font-title); font-weight: 700; color: #64748b;
            position: relative; z-index: 2; transition: all 0.25s ease;
        }

        .step-item.active {
            border-color: var(--primary); background: var(--primary); color: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .step-item.completed {
            border-color: var(--primary); background: var(--primary); color: #ffffff;
        }

        .form-group { display: flex; flex-direction: column; margin-bottom: 18px; }
        .form-row { display: flex; gap: 10px; }

        label { display: block; font-weight: 700; font-size: 0.83rem; color: #334155; margin-bottom: 6px; padding-left: 2px; }

        .btn-sub-action {
            background: rgba(79, 70, 229, 0.1); color: var(--primary); border: none;
            padding: 4px 10px; border-radius: 8px; font-size: 0.73rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease; width: auto; box-shadow: none;
            font-family: var(--font-body);
        }

        .btn-sub-action:hover {
            background: rgba(79, 70, 229, 0.2); transform: none; box-shadow: none;
        }

        input, select { 
            width: 100%; padding: 13px 16px; 
            border: 1px solid rgba(0, 0, 0, 0.1); border-radius: var(--radius-md); 
            font-size: 0.92rem; font-family: var(--font-body);
            background-color: var(--input-bg); color: var(--text-main); 
            transition: all 0.2s ease;
        }
        input::placeholder { color: #94a3b8; }
        input:focus, select:focus { 
            outline: none; border-color: var(--primary); 
            background-color: #ffffff; box-shadow: 0 0 0 4px var(--primary-glow); 
        }

        /* 👁️ 비밀번호 토글 아이콘 스타일 */
        .input-pw-wrapper {
            position: relative;
            width: 100%;
        }
        .input-pw-wrapper input {
            padding-right: 45px !important;
        }
        .input-pw-wrapper .eyes {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            transition: color 0.2s ease;
            user-select: none;
        }
        .input-pw-wrapper .eyes:hover {
            color: var(--primary);
        }

        .autocomplete-wrapper { position: relative; width: 100%; }
        .autocomplete-list {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: #ffffff; border-radius: var(--radius-md); max-height: 180px; overflow-y: auto;
            border: 1px solid rgba(79, 70, 229, 0.2); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12); z-index: 1000;
        }
        .autocomplete-item {
            padding: 12px 16px; cursor: pointer; font-size: 0.88rem;
            color: var(--text-main); border-bottom: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: rgba(79, 70, 229, 0.06); color: var(--primary); font-weight: 600; }
        .autocomplete-item .school-region { font-size: 0.76rem; color: var(--text-muted); }

        .info-text { font-size: 0.76rem; color: var(--text-muted); margin-top: 5px; padding-left: 2px; line-height: 1.35; }

        .agree-container { display: flex; align-items: center; margin: 6px 0 12px 0; padding-left: 2px; cursor: pointer; user-select: none; }
        .agree-container input[type="checkbox"] { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; accent-color: var(--primary); }
        .agree-text { font-size: 0.85rem; color: #334155; font-weight: 600; }
        
        .policy-text-box {
            width: 100%; height: 140px; padding: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08); border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.85); font-size: 0.76rem; line-height: 1.45;
            color: #475569; resize: none; margin-bottom: 12px; font-family: var(--font-body); outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }

        button { 
            font-family: var(--font-title); display: block; 
            background: var(--primary); color: #ffffff; border: none;
            padding: 14px 20px; border-radius: var(--radius-md);
            cursor: pointer; font-weight: 700; font-size: 0.98rem; width: 100%;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); }
        button:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2); }

        button.btn-prev { background: #e2e8f0; color: #475569; box-shadow: none; width: 35%; }
        button.btn-prev:hover { background: #cbd5e1; box-shadow: none; }

        .switch-mode { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted); }
        .switch-link { color: var(--primary); text-decoration: none; font-weight: 700; margin-left: 4px; cursor: pointer; }
        .switch-link:hover { text-decoration: underline; }

        .lite-mode-card {
            margin-top: 20px; padding: 12px 14px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(79, 70, 229, 0.15); border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; transition: all 0.2s ease;
        }

        .lite-mode-card:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
            transform: translateY(-1px);
        }

        .lite-info { display: flex; align-items: center; gap: 10px; }

        .lite-icon {
            width: 32px; height: 32px;
            background: rgba(79, 70, 229, 0.1); color: var(--primary);
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }

        .lite-text-group { display: flex; flex-direction: column; text-align: left; }
        .lite-title { font-size: 0.83rem; font-weight: 700; color: var(--text-main); }
        .lite-desc { font-size: 0.72rem; color: var(--text-muted); }
        .lite-arrow { font-size: 0.85rem; color: var(--primary); font-weight: bold; }

        /* reCAPTCHA 바텀시트 모달 스타일 */
        .captcha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999; display: flex; justify-content: center; align-items: flex-end;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .captcha-overlay.active { opacity: 1; visibility: visible; }

        .captcha-bottom-sheet {
            width: 100%; max-width: 440px; background: #ffffff;
            border-top-left-radius: 32px; border-top-right-radius: 32px;
            padding: 28px 24px 36px 24px; box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.25);
            transform: translateY(100%); transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .captcha-overlay.active .captcha-bottom-sheet { transform: translateY(0); }

        .sheet-handle {
            width: 42px; height: 5px; background: #e2e8f0; border-radius: 3px; margin: 0 auto 16px auto;
        }

        .captcha-header { text-align: center; margin-bottom: 20px; }
        .captcha-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.3px; }
        .captcha-subtext { font-size: 0.82rem; color: #64748b; margin-top: 6px; margin-bottom: 0; line-height: 1.4; }

        .recaptcha-box {
            display: flex; justify-content: center; align-items: center; margin-top: 10px; min-height: 78px;
        }

        /* 토스트(Toast) 메시지 스타일 */
        .toast-container {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 22px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
            z-index: 10000; opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 90%; width: max-content;
        }

        .toast-container.show {
            opacity: 1; pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon { font-size: 1.25rem; line-height: 1; }
        .toast-text { font-size: 0.88rem; font-weight: 600; white-space: pre-line; text-align: left; line-height: 1.4; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 로고 상단 헤더 존 -->
        <div class="header-zone" id="logoZone">
            <div class="logo-wrapper">
                <img src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20250713_196%2F1752417299448f8dDm_PNG%2FKP%25BC%25F6%25C7%25D0%25C0%25D4%25BD%25C3%25C7%25D0%25BF%25F8_%25B7%25CE%25B0%25A1%25B7%25CE1.png" alt="K&P 수학입시학원 로고" class="logo-img">
            </div>
        </div>

        <!-- 학생 로그인 폼 카드 -->
        <div id="loginCard" class="auth-card">
            <h2>학생 로그인</h2>
            <form onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label>유투엠 아이디</label>
                    <input type="text" id="loginId" value="ufes" inputmode="numeric" oninput="handleFixedPrefix(this)" onkeydown="protectPrefix(event, this)" required>
                </div>
                
                <div class="form-group">
                    <label>유투엠 비밀번호</label>
                    <div class="input-pw-wrapper">
                        <input type="password" id="loginPassword" placeholder="숫자 4자리 입력" maxlength="4" inputmode="numeric" required>
                        <div class="eyes" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="fa-regular fa-eye-slash"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" style="margin-top: 8px;">로그인하고 입장하기</button>
            </form>

            <div class="switch-mode">
                처음 왔나요? <span class="switch-link" onclick="toggleMode('register')">회원가입 하기</span>
            </div>

            <!-- Lite 모드 이동 카드 -->
            <a href="https://u2mkst.github.io/home/lite.html" id="liteModeBox" class="lite-mode-card">
                <div class="lite-info">
                    <div class="lite-icon"><i class="emoji-icon mona12">⚡</i></div>
                    <div class="lite-text-group">
                        <span class="lite-title">Lite 모드 이용하기</span>
                        <span class="lite-desc">로그인 없이 빠르게 바로 사용</span>
                    </div>
                </div>
                <span class="lite-arrow">➔</span>
            </a>
        </div>

        <!-- 학생 회원가입 단계별 폼 카드 -->
        <div id="registerCard" class="auth-card hidden">
            <h2>학생 회원가입</h2>

            <div class="step-bar">
                <div class="step-item active" id="stepIndicator1">1</div>
                <div class="step-item" id="stepIndicator2">2</div>
                <div class="step-item" id="stepIndicator3">3</div>
            </div>

            <form id="registerForm" onsubmit="handleStudentRegister(event)">
                <!-- STEP 1 -->
                <div id="step1" class="step-content">
                    <div class="form-group">
                        <label>학생 이름</label>
                        <input type="text" id="registerName" placeholder="실명을 입력하세요 (예: 홍길동)">
                    </div>

                    <div class="form-group">
                        <label>유투엠 아이디</label>
                        <input type="text" id="registerId" value="ufes" inputmode="numeric" oninput="handleFixedPrefix(this)" onkeydown="protectPrefix(event, this)">
                        <div class="info-text">※ ufes 뒤에 숫자만 연속으로 입력하세요.</div>
                    </div>

                    <div class="form-group">
                        <label>유투엠 비밀번호 (숫자 4자리)</label>
                        <div class="input-pw-wrapper">
                            <input type="password" id="registerParentPhone" placeholder="예: 5678" maxlength="4" inputmode="numeric">
                            <div class="eyes" onclick="togglePasswordVisibility('registerParentPhone', this)">
                                <i class="fa-regular fa-eye-slash"></i>
                            </div>
                        </div>
                        <div class="info-text">※ 이 번호가 앞으로 로그인할 때 비밀번호가 됩니다.</div>
                    </div>
                    
                    <div class="form-group">
                        <label>소속 학교</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="registerSchool" placeholder="예: 대치중" autocomplete="off">
                            <div id="schoolList" class="autocomplete-list hidden"></div>
                        </div>
                        <input type="hidden" id="registerSchoolCode"> 
                    </div>

                    <div class="form-group">
                        <label>학년 / 반</label>
                        <div class="form-row">
                            <select id="registerGrade">
                                <option value="" disabled selected>학년 선택</option>
                                <option value="1학년">1학년</option>
                                <option value="2학년">2학년</option>
                                <option value="3학년">3학년</option>
                                <option value="4학년">4학년</option>
                                <option value="5학년">5학년</option>
                                <option value="6학년">6학년</option>
                            </select>
                            <select id="registerClass">
                                <option value="선택 안함">반 선택 (선택사항)</option>
                                <option value="1반">1반</option>
                                <option value="2반">2반</option>
                                <option value="3반">3반</option>
                                <option value="4반">4반</option>
                                <option value="5반">5반</option>
                                <option value="6반">6반</option>
                                <option value="7반">7반</option>
                                <option value="8반">8반</option>
                                <option value="9반">9반</option>
                                <option value="10반">10반</option>
                                <option value="11반">11반</option>
                                <option value="12반">12반</option>
                                <option value="13반">13반</option>
                                <option value="14반">14반</option>
                                <option value="15반">15반</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>담당 선생님 선택</label>
                        <select id="registerTeacher">
                            <option value="" disabled selected>담당 선생님을 선택해 주세요</option>
                            <option value="김동진">김동진 선생님</option>
                            <option value="이주희">이주희 선생님</option>
                            <option value="차현준">차현준 선생님</option>
                            <option value="권준수">권준수 선생님</option>
                            <option value="박다희">박다희 선생님</option>
                            <option value="정찬호">정찬호 선생님</option>
                            <option value="김영호">김영호 선생님</option>
                        </select>
                    </div>

                    <button type="button" onclick="nextStep(2)">다음</button>
                </div>

                <!-- STEP 2 -->
                <div id="step2" class="step-content hidden">
                    <div style="margin-bottom: 14px; text-align: right;">
                        <button type="button" class="btn-sub-action" onclick="skipMathflat()">잘 모르겠어요 <i class="mona12">💡</i></button>

            const isAgreed = document.getElementById('registerAgreement').checked;
            if (!isAgreed) {
                showToast('이용약관 및 개인정보처리방침에 동의하셔야 회원가입이 완료됩니다.', '📜');
                return;
            }

            const studentName = document.getElementById('registerName').value.trim();
            const u2mId = document.getElementById('registerId').value.trim().toLowerCase();
            const phoneTail = document.getElementById('registerParentPhone').value.trim();
            const schoolName = schoolInput.value.trim();
            const schoolCode = schoolCodeInput.value.trim();
            const studentGrade = gradeSelect.value;
            const studentClass = document.getElementById('registerClass').value;
            const selectedTeacher = document.getElementById('registerTeacher').value;
            const mathflatPhone = document.getElementById('registerMathflatPhone').value.trim().replace(/[^0-9]/g, '');
            const mathflatPw = document.getElementById('registerMathflatPw').value.trim();

            const studentEmail = u2mId + "@kst.com"; 
            const studentPassword = "00" + phoneTail; 

            const encryptedName = CryptoJS.AES.encrypt(studentName, SECRET_SALT).toString();
            const encryptedPhoneTail = CryptoJS.AES.encrypt(phoneTail, SECRET_SALT).toString();
            const encryptedMfPhone = mathflatPhone ? CryptoJS.AES.encrypt(mathflatPhone, SECRET_SALT).toString() : "";
            const encryptedMfPw = mathflatPw ? CryptoJS.AES.encrypt(mathflatPw, SECRET_SALT).toString() : "";

            auth.createUserWithEmailAndPassword(studentEmail, studentPassword)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return user.updateProfile({ displayName: studentName }).then(() => {
                        return database.ref('students/' + user.uid).set({
                            name: encryptedName,                  
                            u2mId: u2mId,                         
                            schoolName: schoolName,               
                            schoolCode: schoolCode,               
                            mathGradeCode: studentGrade,          
                            class: studentClass,                  
                            teacher: selectedTeacher,             
                            phone: encryptedPhoneTail,            
                            studentPhone: encryptedMfPhone,       
                            mathflatPw: encryptedMfPw,           
                            mathflatId: mathflatPhone,            
                            joinedAt: firebase.database.ServerValue.TIMESTAMP
                        });
                    });
                })
                .then(() => {
                    showToast('회원가입 완료! 발급된 정보로 로그인해 주세요.', '🎉', 4000);
                    setTimeout(() => {
                        document.getElementById('registerForm').reset();
                        toggleMode('login');
                        document.getElementById('loginId').value = u2mId;
                    }, 1200);
                })
                .catch((error) => {
                    if(error.code === "auth/email-already-in-use") {
                        showToast("이미 등록된 유투엠 아이디입니다.", "⚠️");
                    } else {
                        showToast('회원가입 실패: ' + error.message, '❌');
                    }
                });
        }

        function handleStudentLogin(e) {
            e.preventDefault();

            if (loginFailCount >= 1) {
                openCaptchaModal();
                return;
            }

            executeFirebaseLogin();
        }

        function executeFirebaseLogin() {
            const u2mId = document.getElementById('loginId').value.trim().toLowerCase();
            const phoneTail = document.getElementById('loginPassword').value.trim();

            const studentEmail = u2mId.includes('@') ? u2mId : u2mId + "@kst.com";
            const studentPassword = "00" + phoneTail;

            auth.signInWithEmailAndPassword(studentEmail, studentPassword)
                .then((userCredential) => {
                    loginFailCount = 0;
                    const savedId = studentEmail.split('@')[0];
                    localStorage.setItem('u2m_id', savedId);
                    localStorage.setItem('u2m_pw', studentPassword);
                    window.location.href = './index.html'; 
                })
                .catch((error) => {
                    loginFailCount++;
                    showToast("아이디 또는 비밀번호가 일치하지 않습니다.", "🔒");

                    if (loginFailCount >= 1) {
                        openCaptchaModal();
                    }
                });
        }

        function onCaptchaSuccess(token) {
            loginFailCount = 0; 
            closeCaptchaModal();
            
            const passInput = document.getElementById('loginPassword');
            passInput.value = '';
            passInput.focus();
            
            showToast("보안 인증 완료! 비밀번호를 다시 입력해 주세요.", "✅");
        }
    </script>
</body>
</html>
