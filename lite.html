<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P 수학입시학원 Lite</title>
    
    <!-- 웹폰트 & 아이콘 에셋 선언 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500; 
            font-display: swap;
        }
        @font-face {
            font-family: 'FlightSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/FlightSans-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }
        
        html { font-size: 13.5px; }

        * { font-family: 'FlightSans', 'Paperlogy', 'Noto Sans KR', 'Mona12', sans-serif; }
        
        .emoji-font {
            font-family: 'Mona12', sans-serif !important;
            font-weight: normal !important;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%), 
                        linear-gradient(25deg, #ecd5e3 0%, #cee5f2 60%, #e2daf0 100%);
            background-blend-mode: multiply; 
            margin: 0; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #1d1d1f;
            box-sizing: border-box; 
            padding: 40px 8vw;
            overflow-x: hidden;
        }
        
        .container { width: 100%; max-width: 740px; margin: 0 auto; }
        
        .header-zone {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 24px; padding: 0 8px;
        }
        
        .welcome-text { font-family: 'Paperlogy', sans-serif; font-size: 1.6rem; font-weight: 700; color: #1d1d1f; margin: 0; letter-spacing: -0.8px; }

        .main-grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }
        @media (min-width: 768px) { .main-grid { grid-template-columns: 1fr 1fr; align-items: stretch; } }

        /* Glassmorphism 카드 */
        .glass-card {
            background: rgba(255, 255, 255, 0.38); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.45); 
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.02), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            box-sizing: border-box; display: flex; flex-direction: column;
        }
        
        .info-card { justify-content: space-between; height: 100%; min-height: 250px; padding: 24px; }
        .menu-card { justify-content: center; height: 100%; min-height: 250px; padding: 12px 0; }
        
        /* 수능 D-Day 배지 스타일 */
        .suneung-badge {
            font-family: 'FlightSans', 'Paperlogy', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ff453a;
            letter-spacing: -0.3px;
        }

        /* 가로 광고 배너 */
        .wide-ad-card {
            margin-top: 16px;
            padding: 18px 24px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: #1d1d1f;
            transition: all 0.25s ease;
        }
        .wide-ad-card:hover {
            background: rgba(255, 255, 255, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }
        .wide-ad-title { font-family: 'Paperlogy', sans-serif; font-size: 1.05rem; font-weight: 700; color: #1d1d1f; margin: 0; }
        .wide-ad-desc { font-size: 0.85rem; color: #6e6e73; margin: 2px 0 0 0; }

        /* 날씨 및 시계 */
        .weather-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 0, 0, 0.04); padding-bottom: 12px; }
        .weather-status { font-family: 'Paperlogy', sans-serif; font-size: 0.85rem; font-weight: 600; color: #4a4a4c; display: flex; align-items: center; gap: 6px; }
        .weather-temp { font-family: 'FlightSans', sans-serif; font-size: 1.1rem; font-weight: 700; color: #1d1d1f; }
        .weather-details-text { font-family: 'FlightSans', 'Paperlogy', sans-serif; font-size: 0.75rem; color: #86868b; font-weight: 600; display: flex; gap: 8px; }

        .clock-row { padding: 12px 0; }
        .clock-date { font-family: 'Paperlogy', sans-serif; font-size: 1rem; color: #86868b; font-weight: 600; margin-bottom: 4px; }
        .clock-time { font-family: 'FlightSans', sans-serif; font-size: 3.4rem; font-weight: 700; color: #1d1d1f; letter-spacing: -0.5px; line-height: 1; margin: 0; }

        .quote-row { border-top: 1px solid rgba(0, 0, 0, 0.04); padding-top: 14px; font-size: 0.95rem; line-height: 1.4; color: #4a4a4c; font-weight: 600; }
        .quote-row span { font-family: 'Paperlogy', sans-serif; }
        .quote-author { display: block; font-family: 'Paperlogy', sans-serif; font-size: 0.85rem; color: #86868b; margin-top: 6px; }

        .menu-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 32px; text-decoration: none; color: #1d1d1f; flex: 1;
            transition: all 0.25s ease; cursor: pointer;
        }
        .menu-item:not(:last-child) { border-bottom: 1px solid rgba(0, 0, 0, 0.04); }
        .menu-item:hover { background: rgba(255, 255, 255, 0.35); padding-left: 36px; }
        .menu-item-text { font-family: 'Paperlogy', sans-serif; font-size: 1.15rem; font-weight: 600; letter-spacing: -0.3px; }
        .arrow-icon { font-family: 'FlightSans', sans-serif; font-size: 0.9rem; color: #86868b; transition: transform 0.2s ease, color 0.2s ease; }
        .menu-item:hover .arrow-icon { transform: translateX(4px); color: #0071e3; }

        .footer { margin-top: 40px; text-align: center; }
        .footer-brand { font-family: 'Paperlogy', sans-serif; font-size: 1rem; font-weight: 700; color: #1d1d1f; letter-spacing: -0.3px; margin-bottom: 6px; }
        .footer-brand span { font-family: 'FlightSans', 'Paperlogy', sans-serif; font-weight: 700; }
        .footer-copyright { font-family: 'FlightSans', sans-serif; font-size: 0.75rem; color: #a1a1a6; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 메인 화면 최상단 헤더 영역 -->
        <div class="header-zone">
            <h1 class="welcome-text">오늘도 좋은 하루 보내세요!<span class="emoji-font">🍀</span></h1>
            <!-- 수능 D-Day 표시 영역 -->
            <span id="suneungDday" class="suneung-badge">수능 계산 중...</span>
        </div>

        <!-- 상단 2개의 박스 -->
        <div class="main-grid">
            <!-- 좌측 정보 패널 -->
            <div class="glass-card info-card">
                <div class="weather-row" style="align-items: flex-start; flex-direction: column; gap: 4px;">
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <span class="weather-status" id="weatherStatus">
                            <span style="font-size:1rem;" id="weatherIcon" class="emoji-font">⏳</span> 위치 확인 중...
                        </span>
                        <span class="weather-temp" id="weatherTemp">--°C</span>
                    </div>
                    <div id="weatherDetails" class="weather-details-text"></div>
                </div>
                
                <div class="clock-row">
                    <div class="clock-date" id="dateText">동기화 중...</div>
                    <div class="clock-time" id="timeText">00:00:00</div>
                </div>
                
                <div class="quote-row">
                    <b id="quote-header">오늘의 한마디:</b> <span id="quoteText">명언을 불러오는 중...</span>
                    <span id="quoteAuthor" class="quote-author"></span>
                </div>
            </div>

            <!-- 우측 바로가기 패널 -->
            <div class="glass-card menu-card">
                <a href="https://www.u2math.co.kr/Login/Index" target="_blank" class="menu-item">
                    <span class="menu-item-text">유투엠 바로가기</span>
                    <span class="arrow-icon">➔</span>
                </a>
                <a href="https://student.mathflat.com/" target="_blank" class="menu-item">
                    <span class="menu-item-text">매쓰플랫 바로가기</span>
                    <span class="arrow-icon">➔</span>
                </a>
            </div>
        </div>

        <!-- 하단 가로 광고 배너 -->
        <a href="https://u2mkst.github.io/home/login" class="glass-card wide-ad-card">
            <div>
                <h3 class="wide-ad-title">K&P 수학입시학원 앱 오픈!</h3>
                <p class="wide-ad-desc">로그인후 착몸쌤 KST의 모든 서비스를 이용하세요!</p>
            </div>
        </a>

        <!-- 푸터 -->
        <div class="footer">
            <div class="footer-brand">K&P 수학입시학원 <span>with KST</span></div>
            <div class="footer-copyright">© 2026 KST</div>
        </div>
    </div>

    <script>
    // Firebase 환경 설정
    const firebaseConfig = {
      apiKey: "AIzaSyD-F55blgdfzEygJ9-OUEqw22_EHKOhggg",
      authDomain: "ksthome-76889.firebaseapp.com",
      databaseURL: "https://ksthome-76889-default-rtdb.firebaseio.com",
      projectId: "ksthome-76889",
      storageBucket: "ksthome-76889.firebasestorage.app",
      messagingSenderId: "411945142173",
      appId: "1:411945142173:web:c6fdb499040b2a5a4f9174",
      measurementId: "G-72TJ0364MJ"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const defaultAdvices = [
       { author: "공자", authorProfile: "중국 사상가", message: "배우고 때때로 익히면 또한 기쁘지 아니한가." },
       { author: "아리스토텔레스", authorProfile: "철학자", message: "교육의 뿌리는 쓰지만 그 열매는 달다." },
       { author: "알베르트 아인슈타인", authorProfile: "물리학자", message: "배움을 멈추는 순간 늙기 시작한다." },
       { author: "넬슨 만델라", authorProfile: "전 남아프리카공화국 대통령", message: "교육은 세상을 바꿀 가장 강력한 무기다." },
       { author: "벤저민 프랭클린", authorProfile: "정치가·발명가", message: "지식에 대한 투자는 최고의 이자를 남긴다." },
       { author: "레오나르도 다 빈치", authorProfile: "예술가·발명가", message: "배움은 결코 정신을 지치게 하지 않는다." },
       { author: "마리아 몬테소리", authorProfile: "교육자", message: "아이들은 스스로 배우려는 강한 의지를 가지고 있다." }
    ];

    /* 🎓 지정 연도의 11월 셋째 주 목요일 날짜를 구하는 함수 */
    function getThirdThursdayOfNovember(year) {
        const firstDayOfNov = new Date(year, 10, 1); // 11월 1일 (월은 0부터 시작하므로 10)
        const dayOfWeek = firstDayOfNov.getDay();    // 0(일) ~ 6(토)
        const daysUntilFirstThursday = (4 - dayOfWeek + 7) % 7;
        const thirdThursdayDate = 1 + daysUntilFirstThursday + 14; // 첫째 목요일 + 2주(14일)
        return new Date(year, 10, thirdThursdayDate);
    }

    /* 수능 D-Day 계산 함수 */
    function initSuneungDday() {
        const now = new Date();
        const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        
        let suneungDate = getThirdThursdayOfNovember(now.getFullYear());
        
        // 올해 수능일이 이미 지났다면 내년 11월 셋째 주 목요일로 설정
        if (suneungDate < todayZero) {
            suneungDate = getThirdThursdayOfNovember(now.getFullYear() + 1);
        }

        // 날짜 차이 계산
        const diffDays = Math.ceil((suneungDate - todayZero) / (1000 * 60 * 60 * 24));

        const badgeEl = document.getElementById('suneungDday');
        if (diffDays === 0) {
            badgeEl.innerText = '수능 D-DAY';
        } else if (diffDays > 0) {
            badgeEl.innerText = `수능 D-${diffDays}`;
        } else {
            badgeEl.innerText = `수능 D+${Math.abs(diffDays)}`;
        }
    }

    function listenToFirebaseQuotes() {
        database.ref('advices').on('value', (snapshot) => {
            const data = snapshot.val();
            let adviceList = [];
            if (data) {
                if (Array.isArray(data)) {
                    adviceList = data.filter(item => item !== null && item !== undefined);
                } else if (typeof data === 'object') {
                    adviceList = Object.values(data);
                }
            }
            displayAdvice(adviceList.length > 0 ? adviceList : defaultAdvices);
        }, () => { displayAdvice(defaultAdvices); });
    }

    function displayAdvice(adviceList) {
        const now = new Date();
        const dateValue = now.getFullYear() + (now.getMonth() + 1) + now.getDate();
        const dailyData = adviceList[dateValue % adviceList.length];
        document.getElementById('quote-header').innerText = "오늘의 한마디:";
        document.getElementById('quoteText').innerText = `"${dailyData.message}"`;
        const profileStr = dailyData.authorProfile ? ` (${dailyData.authorProfile})` : "";
        document.getElementById('quoteAuthor').innerText = `- ${dailyData.author}${profileStr}`;
    }

    function updateClock() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('ko-KR', {
            timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
            weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        const parts = formatter.formatToParts(now);
        let month, day, weekday, hour, minute, second;
        for (const part of parts) {
            if (part.type === 'month') month = part.value;
            if (part.type === 'day') day = part.value;
            if (part.type === 'weekday') weekday = part.value;
            if (part.type === 'hour') hour = part.value;
            if (part.type === 'minute') minute = part.value;
            if (part.type === 'second') second = part.value;
        }
        document.getElementById('timeText').innerText = `${hour}:${minute}:${second}`;
        document.getElementById('dateText').innerText = `${parseInt(month)}월 ${parseInt(day)}일 ${weekday}`;
    }

    function initWeather() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
                () => fetchWeather(37.2638, 127.0286)
            );
        } else { fetchWeather(37.2638, 127.0286); }
    }

    async function fetchWeather(lat, lon) {
        const apiKey = '5bce1dcb3eac35e493f0ed9df94b5dac';
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=kr`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error();
            const data = await response.json();
            const temp = Math.round(data.main.temp * 10) / 10;
            document.getElementById('weatherTemp').innerText = `${temp}°C`;

            const weatherId = data.weather[0].id;
            let emoji = '☀️';
            if (weatherId >= 200 && weatherId < 300) emoji = '⛈️';
            else if (weatherId >= 300 && weatherId < 600) emoji = '🌧️';
            else if (weatherId >= 600 && weatherId < 700) emoji = '❄️';
            else if (weatherId >= 700 && weatherId < 800) emoji = '🌫️';
            else if (weatherId === 800) emoji = '☀️';
            else if (weatherId > 800) emoji = '☁️';

            document.getElementById('weatherStatus').innerHTML = `<span style="font-size:1rem;" id="weatherIcon" class="emoji-font">${emoji}</span> ${data.weather[0].description}`;
            document.getElementById('weatherDetails').innerHTML = `<span><span class="emoji-font">💧</span> 습도 ${data.main.humidity}%</span> <span><span class="emoji-font">💨</span> 풍속 ${data.wind.speed}m/s</span>`;
        } catch {
            document.getElementById('weatherStatus').innerHTML = `<span style="font-size:1rem;" class="emoji-font">⚠️</span> 날씨 로드 실패`;
        }
    }

    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);
        listenToFirebaseQuotes();
        initWeather();
        initSuneungDday(); // 고정된 11월 셋째 주 목요일 기준 D-Day 계산
    };
    </script>
</body>
</html>
